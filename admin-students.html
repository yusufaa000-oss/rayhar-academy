<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img src="logo.jpg" alt="RAYHAR ACADEMY">

        <p>For Knowledge and Leadership</p>

    </div>

<main>

  <h2>Student Applications</h2>

  <div class="subtitle">
    Review submitted student biodata and manage admissions.
    Admission letters are generated automatically by the system.
  </div>

  <div id="loadingBox" class="box loading">
    Loading student applications...
  </div>

  <div id="applications"></div>

</main>

<script>

const client = window.supabaseClient;

let studentApplications = [];


/* -----------------------------
   BASIC HELPERS
----------------------------- */

function esc(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString();
}


function info(label, value) {

  return `
    <div class="info">
      <small>${esc(label)}</small>
      <strong>${esc(value || "—")}</strong>
    </div>
  `;
}


function showError(message) {

  document.getElementById("loadingBox").style.display = "none";

  const box = document.getElementById("errorBox");

  box.style.display = "block";

  box.textContent = message;
}


/* -----------------------------
   TIMEOUT HELPER
----------------------------- */

function withTimeout(promise, milliseconds, message) {

  return Promise.race([

    promise,

    new Promise((_, reject) => {

      setTimeout(() => {

        reject(new Error(message));

      }, milliseconds);

    })

  ]);

}


/* -----------------------------
   CREATE STUDENT PHOTO URL
----------------------------- */

async function getStudentPhoto(photoPath) {

  if (!photoPath) {
    return "";
  }

  try {

    const result = await client.storage
      .from("student-photos")
      .createSignedUrl(photoPath, 3600);

    if (result.error) {

      console.error(
        "Unable to create student photo URL:",
        result.error
      );

      return "";
    }

    return result.data?.signedUrl || "";

  } catch (error) {

    console.error(
      "Photo error:",
      error
    );

    return "";
  }
}


/* -----------------------------
   CHECK SESSION + LOAD
----------------------------- */

async function loadApplications() {

  try {

    if (!client) {

      throw new Error(
        "Supabase client was not loaded. Please check config.js."
      );

    }


    const sessionResult = await withTimeout(

      client.auth.getSession(),

      10000,

      "The admin session took too long to load."

    );


    if (sessionResult.error) {

      throw sessionResult.error;

    }


    const session = sessionResult.data?.session;


    if (!session) {

      location.href = "admin-login.html";

      return;
    }


    /*
      The RPC performs the secure administrator check
      on the Supabase server.
    */

    const rpcResult = await withTimeout(

      client.rpc(
        "admin_get_student_applications"
      ),

      15000,

      "The student applications could not be loaded. Please refresh the page."

    );


    if (rpcResult.error) {

      throw rpcResult.error;

    }


    studentApplications = rpcResult.data || [];


    document.getElementById(
      "loadingBox"
    ).style.display = "none";


    renderApplications(studentApplications);


  } catch (error) {

    console.error(
      "Application loading error:",
      error
    );

    showError(
      "Unable to load student applications.\n\n" +
      (error.message || String(error))
    );

  }
}


/* -----------------------------
   RENDER APPLICATIONS
----------------------------- */

async function renderApplications(data) {

  const container =
    document.getElementById("applications");


  if (!data.length) {

    container.innerHTML = `
      <div class="box">
        No student applications have been submitted yet.
      </div>
    `;

    return;
  }


  /*
    Generate all student photo URLs.
  */

  const photoUrls = await Promise.all(

    data.map(item =>
      getStudentPhoto(
        item.biodata?.photo_path
      )
    )

  );


  container.innerHTML = data.map(
    (item, index) => {

      const biodata =
        item.biodata || {};

      const profile =
        item.profile || {};

      const enrollments =
        item.enrollments || [];

      const admission =
        item.admission || null;


      const photoUrl =
        photoUrls[index];


      const departments =
        enrollments
          .map(
            enrollment =>
              enrollment.departments?.name
          )
          .filter(Boolean);


      const admitted =
        String(
          biodata.admission_status || ""
        ).toLowerCase() === "admitted";


      const photoHtml = photoUrl

        ? `
          <img
            class="student-photo"
            src="${esc(photoUrl)}"
            alt="Photo of ${esc(profile.full_name || "student")}"
          >
        `

        : `
          <div class="no-photo">
            No Photo
          </div>
        `;


      return `

        <div class="card">

          <div class="student-header">

            ${photoHtml}

            <div>

              <h3 class="student-name">
                ${esc(
                  profile.full_name ||
                  "Unnamed Student"
                )}
              </h3>

              <div class="student-id">
                ${esc(
                  profile.student_id ||
                  "No Student ID"
                )}
              </div>

              <span class="status ${
                admitted ? "admitted" : ""
              }">

                ${
                  admitted
                    ? "ADMITTED"
                    : "SUBMITTED"
                }

              </span>

            </div>

          </div>


          <div class="grid">

            ${info(
              "Email",
              profile.email
            )}

            ${info(
              "Phone",
              profile.phone
            )}

            ${info(
              "Date of Birth",
              biodata.date_of_birth
            )}

            ${info(
              "Gender",
              biodata.gender
            )}

            ${info(
              "Nationality",
              biodata.nationality
            )}

            ${info(
              "Country",
              biodata.country ||
              "Afghanistan"
            )}

            ${info(
              "Province / State",
              biodata.province
            )}

            ${info(
              "District / City",
              biodata.district_city
            )}

            ${info(
              "Study Level",
              profile.study_level ||
              "Beginner"
            )}

          </div>


          <div class="section">

            <strong class="section-title">
              Residential Address
            </strong>

            <div class="info">
              ${esc(
                biodata.residential_address ||
                "—"
              )}
            </div>

          </div>


          <div class="section">

            <strong class="section-title">
              Next of Kin
            </strong>

            <div class="grid">

              ${info(
                "Name",
                biodata.next_of_kin_name
              )}

              ${info(
                "Phone",
                biodata.next_of_kin_phone
              )}

            </div>

          </div>


          <div class="section">

            <strong class="section-title">
              Departments
            </strong>

            <div class="departments">

              ${
                departments.length

                ? departments.map(
                    department => `
                      <span class="department">
                        ${esc(department)}
                      </span>
                    `
                  ).join("")

                : "No department information"
              }

            </div>

          </div>


          ${
            admission

            ? `

              <div class="admission-box">

                <strong>
                  Admission Letter Issued
                </strong>

                <p>
                  <strong>Issued:</strong>
                  ${esc(
                    formatDate(
                      admission.issued_at
                    )
                  )}
                </p>

                <p>
                  <strong>Downloads:</strong>
                  ${esc(
                    admission.download_count || 0
                  )}
                </p>

                <p>
                  <strong>Last Downloaded:</strong>
                  ${esc(
                    formatDate(
                      admission.last_downloaded_at
                    )
                  )}
                </p>

              </div>

            `

            : ""
          }


          <div class="actions">

            ${
              biodata.application_pdf_path

              ? `

                <button
                  class="light"
                  onclick="downloadApplication(
                    '${esc(
                      biodata.application_pdf_path
                    )}'
                  )"
                >
                  Download Application PDF
                </button>

              `

              : ""
            }


            ${
              admission

              ? `

                <button
                  class="gold"
                  onclick="downloadAdmission(
                    '${esc(
                      admission.storage_path
                    )}'
                  )"
                >
                  Download Admission Letter
                </button>

              `

              : `

                <button
                  class="green"
                  onclick="issueAdmission(${index})"
                >
                  Issue Admission Letter
                </button>

              `
            }

          </div>

        </div>

      `;

    }
  ).join("");

}


/* -----------------------------
   APPLICATION PDF
----------------------------- */

async function downloadApplication(path) {

  try {

    const result = await client.storage
      .from("student-applications")
      .createSignedUrl(
        path,
        3600
      );


    if (result.error) {

      throw result.error;

    }


    window.open(
      result.data.signedUrl,
      "_blank"
    );


  } catch (error) {

    alert(
      "Unable to open application PDF.\n\n" +
      error.message
    );

  }

}


/* -----------------------------
   ADMISSION PDF DOWNLOAD
----------------------------- */

async function downloadAdmission(path) {

  try {

    const result = await client.storage
      .from("admission-letters")
      .createSignedUrl(
        path,
        3600
      );


    if (result.error) {

      throw result.error;

    }


    window.open(
      result.data.signedUrl,
      "_blank"
    );


  } catch (error) {

    alert(
      "Unable to open admission letter.\n\n" +
      error.message
    );

  }

}

----------------------------- */
