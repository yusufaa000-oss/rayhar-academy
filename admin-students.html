<script>

const client = window.supabaseClient;

let studentApplications = [];


/* =========================
   HELPERS
========================= */

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function info(label,value){
  return `
    <div class="info">
      <small>${esc(label)}</small>
      <strong>${esc(value || "—")}</strong>
    </div>
  `;
}


function formatDate(value){

  if(!value) return "—";

  const date = new Date(value);

  if(isNaN(date.getTime())){
    return value;
  }

  return date.toLocaleString();
}


function showError(message){

  document.getElementById("loadingBox").style.display="none";

  const box=document.getElementById("errorBox");

  box.style.display="block";
  box.textContent=message;
}


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications(){

  try{

    if(!client){
      throw new Error(
        "Supabase client was not loaded. Please check config.js."
      );
    }

    const sessionResult =
      await client.auth.getSession();

    if(sessionResult.error){
      throw sessionResult.error;
    }

    const session =
      sessionResult.data.session;

    if(!session){
      throw new Error(
        "No administrator session was found. Please log in again."
      );
    }

    const rpcPromise =
      client.rpc(
        "admin_get_student_applications"
      );

    const timeoutPromise =
      new Promise((_,reject)=>{

        setTimeout(()=>{

          reject(
            new Error(
              "The student applications request timed out. Please refresh the page."
            )
          );

        },15000);

      });

    const result =
      await Promise.race([
        rpcPromise,
        timeoutPromise
      ]);

    if(result.error){
      throw result.error;
    }

    if(!Array.isArray(result.data)){
      throw new Error(
        "The server returned an unexpected applications response."
      );
    }

    studentApplications=result.data;

    document.getElementById(
      "loadingBox"
    ).style.display="none";

    await renderApplications();

  }catch(error){

    console.error(
      "Application loading error:",
      error
    );

    showError(
      "Unable to load student applications.\n\n"+
      (error.message || String(error))
    );
  }
}


/* =========================
   STUDENT PHOTO
========================= */

async function getPhotoUrl(path){

  if(!path){
    return "";
  }

  try{

    const result =
      await client.storage
        .from("student-photos")
        .createSignedUrl(path,3600);

    if(result.error){
      console.error(
        "Photo error:",
        result.error
      );

      return "";
    }

    return result.data?.signedUrl || "";

  }catch(error){

    console.error(
      "Photo error:",
      error
    );

    return "";
  }
}


/* =========================
   RENDER APPLICATIONS
========================= */

async function renderApplications(){

  const container =
    document.getElementById("applications");

  if(!studentApplications.length){

    container.innerHTML=`
      <div class="box">
        No student applications have been submitted yet.
      </div>
    `;

    return;
  }

  const photoUrls =
    await Promise.all(
      studentApplications.map(item =>
        getPhotoUrl(item.biodata?.photo_path)
      )
    );

  container.innerHTML =
    studentApplications.map(
      (item,index)=>{

        const biodata=item.biodata || {};
        const profile=item.profile || {};
        const enrollments=item.enrollments || [];
        const admission=item.admission || null;

        const departments =
          enrollments
            .map(
              enrollment =>
                enrollment.departments?.name
            )
            .filter(Boolean);

        const admitted =
          String(
            biodata.admission_status || ""
          ).toLowerCase()==="admitted";

        const photoUrl=photoUrls[index];

        const photoHtml =
          photoUrl
          ?
          `
            <img
              class="student-photo"
              src="${esc(photoUrl)}"
              alt="Student photo"
            >
          `
          :
          `
            <div class="no-photo">
              No Photo
            </div>
          `;

        return `

          <div class="card">

            <div class="student-header">

              ${photoHtml}

              <div>

                <h3 class="student-name">
                  ${esc(
                    profile.full_name ||
                    "Unnamed Student"
                  )}
                </h3>

                <div class="student-id">
                  ${esc(
                    profile.student_id ||
                    "No Student ID"
                  )}
                </div>

                <span
                  class="status ${
                    admitted ? "admitted" : ""
                  }"
                >
                  ${
                    admitted
                    ? "ADMITTED"
                    : "SUBMITTED"
                  }
                </span>

              </div>

            </div>

            <div class="grid">

              ${info("Email",profile.email)}

              ${info("Phone",profile.phone)}

              ${info(
                "Date of Birth",
                biodata.date_of_birth
              )}

              ${info(
                "Gender",
                biodata.gender
              )}

              ${info(
                "Nationality",
                biodata.nationality
              )}

              ${info(
                "Country",
                biodata.country
              )}

              ${info(
                "Province / State / Region",
                biodata.province
              )}

              ${info(
                "District / City / Area",
                biodata.district_city
              )}

              ${info(
                "Study Level",
                profile.study_level || "Beginner"
              )}

            </div>

            <div class="section">

              <strong class="section-title">
                Residential Address
              </strong>

              <div class="info">
                ${esc(
                  biodata.residential_address || "—"
                )}
              </div>

            </div>

            <div class="section">

              <strong class="section-title">
                Next of Kin
              </strong>

              <div class="grid">

                ${info(
                  "Name",
                  biodata.next_of_kin_name
                )}

                ${info(
                  "Phone",
                  biodata.next_of_kin_phone
                )}

              </div>

            </div>

            <div class="section">

              <strong class="section-title">
                Departments
              </strong>

              <div class="departments">

                ${
                  departments.length
                  ?
                  departments
                    .map(
                      department=>`
                        <span class="department">
                          ${esc(department)}
                        </span>
                      `
                    )
                    .join("")
                  :
                  "No department information"
                }

              </div>

            </div>

            ${
              admission
              ?
              `
                <div class="admission-box">

                  <strong>
                    Admission Letter Issued
                  </strong>

                  <p>
                    <strong>Issued:</strong>
                    ${esc(
                      formatDate(admission.issued_at)
                    )}
                  </p>

                  <p>
                    <strong>Downloads:</strong>
                    ${esc(
                      admission.download_count || 0
                    )}
                  </p>

                  <p>
                    <strong>Last Downloaded:</strong>
                    ${esc(
                      formatDate(
                        admission.last_downloaded_at
                      )
                    )}
                  </p>

                </div>
              `
              :
              ""
            }

            <div class="actions">

              ${
                biodata.application_pdf_path
                ?
                `
                  <button
                    class="light"
                    onclick='downloadApplication(${JSON.stringify(
                      biodata.application_pdf_path
                    )})'
                  >
                    Download Application PDF
                  </button>
                `
                :
                ""
              }

              ${
                admission
                ?
                `
                  <button
                    class="gold"
                    onclick='downloadAdmission(${JSON.stringify(
                      admission.storage_path
                    )})'
                  >
                    Download Admission Letter
                  </button>

                  <button
                    class="green"
                    onclick="issueAdmission(${index})"
                  >
                    Re-issue Admission Letter
                  </button>
                `
                :
                `
                  <button
                    class="green"
                    onclick="issueAdmission(${index})"
                  >
                    Issue Admission Letter
                  </button>
                `
              }

            </div>

          </div>

        `;
      }
    ).join("");
}


/* =========================
   APPLICATION PDF
========================= */

async function downloadApplication(path){

  try{

    const result =
      await client.storage
        .from("student-applications")
        .createSignedUrl(path,3600);

    if(result.error){
      throw result.error;
    }

    window.open(
      result.data.signedUrl,
      "_blank"
    );

  }catch(error){

    alert(
      "Unable to open application PDF.\n\n"+
      error.message
    );
  }
}


/* =========================
   ADMISSION PDF DOWNLOAD
========================= */

async function downloadAdmission(path){

  try{

    const result =
      await client.storage
        .from("admission-letters")
        .createSignedUrl(path,3600);

    if(result.error){
      throw result.error;
    }

    window.open(
      result.data.signedUrl,
      "_blank"
    );

  }catch(error){

    alert(
      "Unable to open admission letter.\n\n"+
      error.message
    );
  }
}


/* =========================
   IMAGE TO DATA URL
========================= */

function loadImageAsDataURL(src){

  return new Promise((resolve,reject)=>{

    const img=new Image();

    img.onload=()=>{

      try{

        const canvas=
          document.createElement("canvas");

        canvas.width=
          img.naturalWidth;

        canvas.height=
          img.naturalHeight;

        const ctx=
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.92
          )
        );

      }catch(error){

        reject(error);
      }
    };

    img.onerror=()=>{
      reject(
        new Error(
          "The RAYHAR ACADEMY logo could not be loaded."
        )
      );
    };

    img.src=src;
  });
}


/* =========================
   CREATE ADMISSION PDF
========================= */

async function createAdmissionPDF({
  profile,
  biodata,
  departments,
  studyLevel,
  country,
  province,
  district
}){

  if(
    !window.jspdf ||
    !window.jspdf.jsPDF
  ){

    throw new Error(
      "The PDF generator could not be loaded. Please refresh the page."
    );
  }

  const jsPDF=window.jspdf.jsPDF;

  const pdf=
    new jsPDF({
      orientation:"portrait",
      unit:"mm",
      format:"a4"
    });

  const navy=[7,17,31];
  const gold=[212,175,55];
  const dark=[30,35,45];
  const grey=[95,101,112];
  const paleGold=[250,246,231];
  const white=[255,255,255];

  const pageWidth=210;
  const pageHeight=297;

  const now=new Date();

  const admissionDate=
    now.toLocaleDateString("en-GB");

  const year=now.getFullYear();

  const studentId=
    profile.student_id || "STUDENT";

  const reference=
    "RA/ADM/" +
    year +
    "/" +
    studentId;


  /* =========================
     WHITE PAGE
  ========================= */

  pdf.setFillColor(
    white[0],
    white[1],
    white[2]
  );

  pdf.rect(
    0,
    0,
    pageWidth,
    pageHeight,
    "F"
  );


  /* =========================
     GOLD OUTER BORDER
  ========================= */

  pdf.setDrawColor(
    gold[0],
    gold[1],
    gold[2]
  );

  pdf.setLineWidth(1.1);

  pdf.rect(
    7,
    7,
    196,
    283
  );


  /* =========================
     INNER BORDER
  ========================= */

  pdf.setDrawColor(
    navy[0],
    navy[1],
    navy[2]
  );

  pdf.setLineWidth(0.3);

  pdf.rect(
    10,
    10,
    190,
    277
  );


  /* =========================
     WATERMARK
  ========================= */

  try{

    const logoData=
      await loadImageAsDataURL(
        "logo.jpg"
      );

    const img=new Image();

    img.src=logoData;

    await new Promise(resolve=>{

      img.onload=resolve;
      img.onerror=resolve;

    });

    const canvas=
      document.createElement("canvas");

    canvas.width=
      img.naturalWidth || 500;

    canvas.height=
      img.naturalHeight || 500;

    const ctx=
      canvas.getContext("2d");

    ctx.globalAlpha=0.075;

    ctx.drawImage(
      img,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const watermark=
      canvas.toDataURL("image/png");

    pdf.addImage(
      watermark,
      "PNG",
      45,
      82,
      120,
      120,
      undefined,
      "FAST"
    );

  }catch(error){

    console.warn(
      "Watermark could not be created:",
      error
    );
  }


  /* =========================
     HEADER
  ========================= */

  pdf.setFillColor(
    navy[0],
    navy[1],
    navy[2]
  );

  pdf.roundedRect(
    15,
    15,
    180,
    43,
    2,
    2,
    "F"
  );


  /* Logo */

  try{

    const logo=
      await loadImageAsDataURL(
        "logo.jpg"
      );

    pdf.addImage(
      logo,
      "JPEG",
      21,
      20,
      33,
      33
    );

  }catch(error){

    console.warn(
      "Logo could not be added:",
      error
    );
  }


  /* School name */

  pdf.setTextColor(
    gold[0],
    gold[1],
    gold[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.setFontSize(21);

  pdf.text(
    "RAYHAR ACADEMY",
    108,
    31,
    {
      align:"center"
    }
  );


  /* Slogan */

  pdf.setTextColor(
    white[0],
    white[1],
    white[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.setFontSize(9);

  pdf.text(
    "For Knowledge and Leadership",
    108,
    40,
    {
      align:"center"
    }
  );

  pdf.setFontSize(7.5);

  pdf.text(
    "STUDENT ADMISSIONS OFFICE",
    108,
    49,
    {
      align:"center"
    }
  );


  /* =========================
     TITLE
  ========================= */

  pdf.setTextColor(
    navy[0],
    navy[1],
    navy[2]
  );
  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.setFontSize(11);

  pdf.text(
    "ADMITTED",
    120,
    130
  );


  /* =========================
     FORMAL LETTER
  ========================= */

  pdf.setTextColor(
    dark[0],
    dark[1],
    dark[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.setFontSize(10);

  pdf.text(
    "Dear " +
    (profile.full_name || "Student") +
    ",",
    20,
    153
  );


  const opening =
    "We are pleased to formally offer you admission to RAYHAR ACADEMY. " +
    "Following the review of your submitted application and student information, " +
    "you have been admitted to study with us under the programme details stated below.";

  const openingLines =
    pdf.splitTextToSize(
      opening,
      170
    );

  pdf.text(
    openingLines,
    20,
    162,
    {
      lineHeightFactor: 1.5
    }
  );


  /* =========================
     PROGRAMME SECTION
  ========================= */

  let y = 181;

  pdf.setFillColor(
    navy[0],
    navy[1],
    navy[2]
  );

  pdf.roundedRect(
    20,
    y,
    170,
    8,
    1.5,
    1.5,
    "F"
  );

  pdf.setTextColor(
    gold[0],
    gold[1],
    gold[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.setFontSize(8);

  pdf.text(
    "PROGRAMME INFORMATION",
    25,
    y + 5.5
  );

  y += 16;


  /* =========================
     DEPARTMENTS
  ========================= */

  pdf.setTextColor(
    grey[0],
    grey[1],
    grey[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.setFontSize(8);

  pdf.text(
    "Department(s):",
    25,
    y
  );

  pdf.setTextColor(
    dark[0],
    dark[1],
    dark[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  const departmentLines =
    pdf.splitTextToSize(
      departments.length
        ? departments.join(", ")
        : "Not specified",
      115
    );

  pdf.text(
    departmentLines,
    70,
    y
  );

  y += Math.max(
    7,
    departmentLines.length * 5
  );


  /* =========================
     COUNTRY
  ========================= */

  pdf.setTextColor(
    grey[0],
    grey[1],
    grey[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.setFontSize(8);

  pdf.text(
    "Country:",
    25,
    y
  );

  pdf.setTextColor(
    dark[0],
    dark[1],
    dark[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    country,
    70,
    y
  );

  y += 7;


  /* =========================
     PROVINCE / STATE / REGION
  ========================= */

  pdf.setTextColor(
    grey[0],
    grey[1],
    grey[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.text(
    "State / Province / Region:",
    25,
    y
  );

  pdf.setTextColor(
    dark[0],
    dark[1],
    dark[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    province,
    70,
    y
  );

  y += 7;


  /* =========================
     DISTRICT / CITY
  ========================= */

  pdf.setTextColor(
    grey[0],
    grey[1],
    grey[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.text(
    "District / City / Area:",
    25,
    y
  );

  pdf.setTextColor(
    dark[0],
    dark[1],
    dark[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.text(
    district,
    70,
    y
  );


  /* =========================
     CLOSING
  ========================= */

  y += 12;

  const closing =
    "We welcome you to RAYHAR ACADEMY and look forward to supporting " +
    "your academic development, character, knowledge and leadership journey. " +
    "Please retain this letter as your official admission document.";

  const closingLines =
    pdf.splitTextToSize(
      closing,
      170
    );

  pdf.setTextColor(
    dark[0],
    dark[1],
    dark[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.setFontSize(9.5);

  pdf.text(
    closingLines,
    20,
    y,
    {
      lineHeightFactor: 1.45
    }
  );


  /* =========================
     AUTHORIZATION
  ========================= */

  y += Math.max(
    20,
    closingLines.length * 6 + 12
  );

  pdf.setDrawColor(
    gold[0],
    gold[1],
    gold[2]
  );

  pdf.setLineWidth(0.5);

  pdf.line(
    25,
    y,
    85,
    y
  );

  pdf.line(
    125,
    y,
    185,
    y
  );

  pdf.setTextColor(
    navy[0],
    navy[1],
    navy[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.setFontSize(8);

  pdf.text(
    "Admissions Office",
    55,
    y + 6,
    {
      align: "center"
    }
  );

  pdf.text(
    "Authorized Signature",
    155,
    y + 6,
    {
      align: "center"
    }
  );


  /* =========================
     OFFICIAL DOCUMENT NOTICE
  ========================= */

  pdf.setFillColor(
    navy[0],
    navy[1],
    navy[2]
  );

  pdf.roundedRect(
    20,
    263,
    170,
    10,
    2,
    2,
    "F"
  );

  pdf.setTextColor(
    gold[0],
    gold[1],
    gold[2]
  );

  pdf.setFont(
    "helvetica",
    "bold"
  );

  pdf.setFontSize(7.5);

  pdf.text(
    "OFFICIAL ADMISSION DOCUMENT",
    105,
    269.5,
    {
      align: "center"
    }
  );


  /* =========================
     FOOTER
  ========================= */

  pdf.setTextColor(
    grey[0],
    grey[1],
    grey[2]
  );

  pdf.setFont(
    "helvetica",
    "normal"
  );

  pdf.setFontSize(6.5);

  pdf.text(
    "RAYHAR ACADEMY • For Knowledge and Leadership",
    105,
    280,
    {
      align: "center"
    }
  );

  pdf.text(
    reference,
    105,
    284,
    {
      align: "center"
    }
  );


  /* =========================
     RETURN PDF
  ========================= */

  return pdf.output("blob");
}


/* =========================
   ISSUE / RE-ISSUE ADMISSION
========================= */

async function issueAdmission(index){

  const application =
    studentApplications[index];

  if(!application){

    alert(
      "Student application could not be found."
    );

    return;
  }

  const biodata =
    application.biodata || {};

  const profile =
    application.profile || {};

  if(!profile.id){

    alert(
      "Student information is incomplete."
    );

    return;
  }

  const isReissue =
    !!application.admission;

  const confirmed =
    confirm(
      (
        isReissue
          ? "Re-issue"
          : "Issue"
      ) +
      " an admission letter for " +
      (
        profile.full_name ||
        "this student"
      ) +
      " (" +
      (
        profile.student_id ||
        "No Student ID"
      ) +
      ")?"
    );

  if(!confirmed){
    return;
  }

  try{

    const userResult =
      await client.auth.getUser();

    if(userResult.error){
      throw userResult.error;
    }

    const adminUser =
      userResult.data.user;

    if(!adminUser){

      throw new Error(
        "Your administrator session has expired."
      );
    }


    /* =========================
       STUDENT DETAILS
    ========================= */

    const departments =
      (
        application.enrollments || []
      )
      .map(
        enrollment =>
          enrollment.departments?.name
      )
      .filter(Boolean);

    const studyLevel =
      profile.study_level ||
      "Beginner";

    const country =
      biodata.country ||
      "Not specified";

    const province =
      biodata.province ||
      "Not specified";

    const district =
      biodata.district_city ||
      "Not specified";


    /* =========================
       GENERATE PDF
    ========================= */

    const pdfBlob =
      await createAdmissionPDF({

        profile,

        biodata,

        departments,

        studyLevel,

        country,

        province,

        district

      });


    /* =========================
       UNIQUE FILE
    ========================= */

    const timestamp =
      Date.now();

    const fileName =
      "admission-letter-" +
      timestamp +
      ".pdf";

    const storagePath =
      profile.id +
      "/" +
      fileName;


    /* =========================
       UPLOAD PDF
    ========================= */

    const uploadResult =
      await client.storage
        .from("admission-letters")
        .upload(
          storagePath,
          pdfBlob,
          {
            contentType:
              "application/pdf",

            upsert:false
          }
        );

    if(uploadResult.error){
      throw uploadResult.error;
    }


    /* =========================
       DELETE OLD DATABASE RECORD
    ========================= */

    const deleteResult =
      await client
        .from("admission_letters")
        .delete()
        .eq(
          "student_id",
          profile.id
        );

    if(deleteResult.error){

      console.warn(
        "Old admission record could not be removed:",
        deleteResult.error
      );

    }


    /* =========================
       SAVE NEW ADMISSION
    ========================= */

    const insertResult =
      await client
        .from("admission_letters")
        .insert({

          student_id:
            profile.id,

          file_name:
            fileName,

          storage_path:
            storagePath,

          issued_by:
            adminUser.id,

          student_name:
            profile.full_name || "",

          student_id_number:
            profile.student_id || "",

          departments_text:
            departments.length
              ? departments.join(", ")
              : "Not specified",

          study_level:
            studyLevel

        })
        .select()
        .single();

    if(insertResult.error){
      throw insertResult.error;
    }


    /* =========================
       MARK AS ADMITTED
    ========================= */

    const biodataUpdate =
      await client
        .from("student_biodata")
        .update({

          admission_status:
            "admitted",

          reviewed_at:
            new Date().toISOString(),

          reviewed_by:
            adminUser.id

        })
        .eq(
          "student_id",
          profile.id
        );

    if(biodataUpdate.error){
      throw biodataUpdate.error;
    }


    /* =========================
       SUCCESS
    ========================= */

    alert(
      "Admission letter " +
      (
        isReissue
          ? "re-issued"
          : "issued"
      ) +
      " successfully.\n\n" +
      "The new professionally designed PDF is now available in the student's portal."
    );

    await loadApplications();

  }catch(error){

    console.error(
      "Admission issue error:",
      error
    );

    alert(
      "Unable to " +
      (
        isReissue
          ? "re-issue"
          : "issue"
      ) +
      " the admission letter.\n\n" +
      (
        error.message ||
        String(error)
      )
    );
  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  try{

    await client.auth.signOut();

  }catch(error){

    console.error(
      "Logout error:",
      error
    );

  }finally{

    window.location.href =
      "admin-login.html";

  }
}
