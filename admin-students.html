}

}

  align-items:center;

}

}

}

  }

</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img src="logo.jpg" alt="RAYHAR ACADEMY">
      <div>
        <h1>RAYHAR ACADEMY</h1>
        <p>For Knowledge and Leadership</p>
      </div>
    </div>

    <button class="logout" onclick="logout()">Logout</button>

  </div>
</header>

<main>

  <div class="page-title">
    <h2>Student Applications</h2>
    <p>Review submitted student biodata and manage admissions. Admission letters are generated automatically by the system.</p>
  </div>

  <div id="errorBox" class="error"></div>

  <div id="loading" class="loading">
    Loading student applications...
  </div>

  <div id="apps"></div>

</main>

<div id="reviewModal" class="modal">
  <div class="modal-box">

    <div class="modal-head">
      <h3>Student Application</h3>
      <button class="close" onclick="closeModal()">Close</button>
    </div>

    <div id="modalContent"></div>

  </div>
</div>

<script>

const client = window.supabaseClient;

let applications = [];
let currentApplication = null;

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(value){
  if(!value) return "—";

  const date = new Date(value);

  if(Number.isNaN(date.getTime())){
    return value;
  }

  return date.toLocaleString();
}

async function checkAdmin(){

  const {
    data:{session},
    error
  } = await client.auth.getSession();

  if(error || !session){
    window.location.href="admin-login.html";
    return false;
  }

  const {data:profile,error:profileError} =
    await client
      .from("profiles")
      .select("role")
      .eq("id",session.user.id)
      .single();

  if(profileError || !profile || profile.role !== "admin"){
    await client.auth.signOut();
    window.location.href="admin-login.html";
    return false;
  }

  return true;
}

async function load(){

  $("loading").style.display="block";
  $("apps").innerHTML="";
  $("errorBox").style.display="none";

  try{

    const isAdmin = await checkAdmin();

    if(!isAdmin){
      return;
    }

    /*
      Use the security-definer RPC.

      This loads:
      - biodata
      - profile
      - departments/enrollments
      - existing admission letter

      in one request.
    */

    const {
      data,
      error
    } = await client.rpc("admin_get_student_applications");

    if(error){
      throw error;
    }

    applications =
      (Array.isArray(data) ? data : [])
      .map(item => ({
        biodata:item.biodata || {},
        profile:item.profile || {},
        enrollments:item.enrollments || [],
        admission:item.admission || null,
        photoUrl:""
      }));

    render();

    $("loading").style.display="none";

    /*
      Photos are loaded after the applications themselves.
      Therefore a missing/broken photo can never stop the
      student applications from appearing.
    */

    await Promise.all(
      applications.map(async app => {

        const path = app.biodata.photo_path;

        if(!path){
          return;
        }

        try{

          const {
            data:signed,
            error:signedError
          } = await client.storage
            .from("student-photos")
            .createSignedUrl(path,3600);

          if(!signedError && signed){
            app.photoUrl = signed.signedUrl;
          }

        }catch(photoError){

          console.warn(
            "Could not load student photo:",
            photoError
          );

        }

      })
    );

    render();

  }catch(error){

    console.error(error);

    $("loading").style.display="none";

    $("errorBox").style.display="block";

    $("errorBox").textContent =
      "Unable to load student applications. " +
      (error?.message || "Please try again.");

  }
}

function render(){

  const container = $("apps");

  container.innerHTML="";

  if(!applications.length){

    container.innerHTML = `
      <div class="empty">
        No student applications have been submitted yet.
      </div>
    `;

    return;
  }

  applications.forEach((app,index)=>{

    const biodata = app.biodata;
    const profile = app.profile;

    const name =
      profile.full_name ||
      biodata.full_name ||
      "Unnamed Student";

    const studentId =
      profile.student_id ||
      "Not available";

    const status =
      biodata.admission_status ||
      "submitted";

    const departments =
      app.enrollments
        .filter(e => e && e.status !== "inactive")
        .map(e =>
          e.departments?.name ||
          e.department?.name ||
          e.department_name ||
          null
        )
        .filter(Boolean);

    /*
      The RPC normally returns department name as:
      enrollments[].departments.name

      But also support department_name for safety.
    */

    let departmentNames = departments;

    if(!departmentNames.length){

      departmentNames =
        app.enrollments
          .map(e => {

            if(e.departments && e.departments.name){
              return e.departments.name;
            }

            if(e.department && e.department.name){
              return e.department.name;
            }

            return e.department_name || null;

          })
          .filter(Boolean);

    }

    const studyLevel =
      profile.study_level ||
      biodata.study_level ||
      app.enrollments.find(e=>e.study_level)?.study_level ||
      "Beginner";

    const admissionStatus =
      status.toLowerCase() === "admitted"
        ? `<span class="status admitted">ADMITTED</span>`
        : `<span class="status">SUBMITTED</span>`;

    const photo =
      app.photoUrl
      ? `<img class="student-photo" src="${escapeHtml(app.photoUrl)}" alt="Student photo">`
      : `<div class="student-photo"></div>`;

    const admission = app.admission;

    const admissionBox =
      admission
      ? `
        <div class="admission-box">

          <strong>Admission Letter Issued</strong>

          <div style="margin-top:7px;font-size:13px;">
            Issued: ${escapeHtml(formatDate(admission.issued_at))}
          </div>

          <div style="margin-top:5px;font-size:13px;">
            Downloads: ${escapeHtml(admission.download_count || 0)}
          </div>

          <div style="margin-top:5px;font-size:13px;">
            Last downloaded:
            ${escapeHtml(
              formatDate(admission.last_downloaded_at)
            )}
          </div>

        </div>
      `
      : "";

    container.innerHTML += `

      <div class="application">

        <div class="application-head">

          <div class="student-main">

            ${photo}

            <div>

              <h3 class="student-name">
                ${escapeHtml(name)}
              </h3>

              <div class="student-id">
                ${escapeHtml(studentId)}
              </div>

              <div style="margin-top:8px;">
                ${admissionStatus}
              </div>

            </div>

          </div>

        </div>

        <div class="grid">

          <div class="info">
            <label>Email</label>
            <strong>
              ${escapeHtml(profile.email || "—")}
            </strong>
          </div>

          <div class="info">
            <label>Phone</label>
            <strong>
              ${escapeHtml(
                profile.phone ||
                biodata.next_of_kin_phone ||
                "—"
              )}
            </strong>
          </div>

          <div class="info">
            <label>Date of Birth</label>
            <strong>
              ${escapeHtml(biodata.date_of_birth || "—")}
            </strong>
          </div>

          <div class="info">
            <label>Gender</label>
            <strong>
              ${escapeHtml(biodata.gender || "—")}
            </strong>
          </div>

          <div class="info">
            <label>Nationality</label>
            <strong>
              ${escapeHtml(biodata.nationality || "—")}
            </strong>
          </div>

          <div class="info">
            <label>Country</label>
            <strong>
              ${escapeHtml(biodata.country || "Afghanistan")}
            </strong>
          </div>

          <div class="info">
            <label>Province / State</label>
            <strong>
              ${escapeHtml(biodata.province || "—")}
            </strong>
          </div>

          <div class="info">
            <label>District / City</label>
            <strong>
              ${escapeHtml(biodata.district_city || "—")}
            </strong>
          </div>

          <div class="info">
            <label>Study Level</label>
            <strong>
              ${escapeHtml(studyLevel)}
            </strong>
          </div>

          <div class="info">
            <label>Submitted</label>
            <strong>
              ${escapeHtml(
                formatDate(biodata.submitted_at)
              )}
            </strong>
          </div>

        </div>

        <div class="section">

          <h3>Residential Address</h3>

          <div class="info">
            ${escapeHtml(
              biodata.residential_address || "—"
            )}
          </div>

        </div>

        <div class="section">

          <h3>Next of Kin</h3>

          <div class="grid">

            <div class="info">
              <label>Name</label>
              <strong>
                ${escapeHtml(
                  biodata.next_of_kin_name || "—"
                )}
              </strong>
            </div>

            <div class="info">
              <label>Phone</label>
              <strong>
                ${escapeHtml(
                  biodata.next_of_kin_phone || "—"
                )}
              </strong>
            </div>

          </div>

        </div>

        <div class="section">

          <h3>Departments</h3>

          <div class="departments">

            ${
              departmentNames.length
              ? departmentNames
                  .map(d =>
                    `<span class="department">
                      ${escapeHtml(d)}
                    </span>`
                  )
                  .join("")
              : `<span style="color:#6b7280;">
                  No department information
                 </span>`
            }

          </div>

        </div>

        ${admissionBox}

        <div class="actions">

          <button
            class="btn-primary"
            onclick="reviewApplication(${index})">
            Review Biodata
          </button>

          ${
            biodata.application_pdf_path
            ? `
              <button
                class="btn-light"
                onclick="downloadApplication(${index})">
                Download Application PDF
              </button>
            `
            : ""
          }

          ${
            admission
            ? `
              <button
                class="btn-gold"
                onclick="downloadAdmission(${index})">
                Download Admission Letter
              </button>
            `
            : `
              <button
                class="btn-success"
                onclick="issueAdmission(${index})">
                Issue Admission Letter
              </button>
            `
          }

        </div>

      </div>
    `;
  });
}

function reviewApplication(index){

  const app = applications[index];

  currentApplication = app;

  const b = app.biodata;
  const p = app.profile;

  const departments =
    app.enrollments
      .map(e =>
        e.departments?.name ||
        e.department?.name ||
        e.department_name ||
        null
      )
      .filter(Boolean);

  $("modalContent").innerHTML = `

    <div class="notice">
      Review the student's submitted biodata before issuing an admission letter.
    </div>

    <div class="grid">

      <div class="info">
        <label>Full Name</label>
        <strong>
          ${escapeHtml(p.full_name || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Student ID</label>
        <strong>
          ${escapeHtml(p.student_id || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Email</label>
        <strong>
          ${escapeHtml(p.email || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Phone</label>
        <strong>
          ${escapeHtml(p.phone || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Date of Birth</label>
        <strong>
          ${escapeHtml(b.date_of_birth || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Gender</label>
        <strong>
          ${escapeHtml(b.gender || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Nationality</label>
        <strong>
          ${escapeHtml(b.nationality || "—")}
        </strong>
      </div>

      <div class="info">
        <label>Country</label>
        <strong>
          ${escapeHtml(b.country || "Afghanistan")}
        </strong>
      </div>

      <div class="info">
        <label>Province / State</label>
        <strong>
          ${escapeHtml(b.province || "—")}
        </strong>
      </div>

      <div class="info">
        <label>District / City</label>
        <strong>
          ${escapeHtml(b.district_city || "—")}
        </strong>
      </div>

    </div>

    <div class="section">

      <h3>Residential Address</h3>

      <div class="info">
        ${escapeHtml(b.residential_address || "—")}
      </div>

    </div>

    <div class="section">

      <h3>Next of Kin</h3>

      <div class="grid">

        <div class="info">
          <label>Name</label>
          <strong>
            ${escapeHtml(b.next_of_kin_name || "—")}
          </strong>
        </div>

        <div class="info">
          <label>Phone</label>
          <strong>
            ${escapeHtml(b.next_of_kin_phone || "—")}
          </strong>
        </div>

      </div>

    </div>

    <div class="section">

      <h3>Departments</h3>

      <div class="departments">

        ${
          departments.length
          ? departments
              .map(d =>
                `<span class="department">
                  ${escapeHtml(d)}
                </span>`
              )
              .join("")
          : "No department information"
        }

      </div>

    </div>

    <div class="actions">

      ${
        !app.admission
        ? `
          <button
            class="btn-success"
            onclick="closeModal();issueAdmission(${applications.indexOf(app)})">
            Issue Admission Letter
          </button>
        `
        : `
          <button
            class="btn-gold"
            onclick="closeModal();downloadAdmission(${applications.indexOf(app)})">
            Download Admission Letter
          </button>
        `
      }

    </div>
  `;

  $("reviewModal").style.display="flex";
}

function closeModal(){
  $("reviewModal").style.display="none";
}

async function downloadApplication(index){

  const app = applications[index];

  const path =
    app.biodata.application_pdf_path;

  if(!path){
    alert("Application PDF is not available.");
    return;
  }

  try{

    const {
      data,
      error
    } = await client.storage
