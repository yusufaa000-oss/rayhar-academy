<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Applications | RAYHAR ACADEMY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111827}
header{background:#07111f;color:#fff;padding:18px}
.header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.logo h1{margin:0;color:#d4af37;font-size:19px}
.logo p{margin:3px 0 0;font-size:12px}
button{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:bold}
.logout{background:#d4af37;color:#07111f}
main{max-width:1100px;margin:30px auto;padding:0 18px}
.subtitle{color:#6b7280;margin-bottom:25px}
.box{background:#fff;padding:25px;border-radius:10px;margin-bottom:20px}
.error{display:none;background:#fee2e2;color:#991b1b;white-space:pre-wrap}
.card{background:#fff;border-radius:12px;padding:22px;margin-bottom:25px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.student{display:flex;gap:15px;align-items:center;border-bottom:1px solid #e5e7eb;padding-bottom:18px}
.photo{width:75px;height:75px;border-radius:8px;background:#e5e7eb;object-fit:cover}
.name{margin:0 0 5px;font-size:20px}
.sid{color:#9a7b16;font-weight:bold}
.status{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:20px;font-size:12px;background:#fef3c7;color:#92400e}
.admitted{background:#dcfce7;color:#166534}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.info{background:#f8fafc;padding:12px;border-radius:7px}
.info small{display:block;color:#6b7280;text-transform:uppercase;font-size:10px;margin-bottom:5px}
.info strong{word-break:break-word}
.section{margin-top:20px}
.departments{display:flex;flex-wrap:wrap;gap:7px}
.department{background:#07111f;color:#d4af37;padding:7px 10px;border-radius:20px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.primary{background:#07111f;color:#fff}
.gold{background:#d4af37;color:#07111f}
.green{background:#15803d;color:#fff}
.light{background:#e5e7eb}
.admission{margin-top:20px;padding:15px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.actions button{width:100%}}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
<img src="logo.jpg" alt="RAYHAR ACADEMY">
<div>
<h1>RAYHAR ACADEMY</h1>
<p>For Knowledge and Leadership</p>
</div>
</div>

<button class="logout" onclick="logout()">Logout</button>

</div>
</header>

<main>

<h2>Student Applications</h2>

<div class="subtitle">
Review submitted student biodata and manage admissions.
Admission letters are generated automatically by the system.
</div>

<div id="error" class="box error"></div>

<div id="loading" class="box">
Loading student applications...
</div>

<div id="applications"></div>

</main>

<script>

const client = window.supabaseClient;

function esc(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function showError(message){
document.getElementById("loading").style.display="none";
const box=document.getElementById("error");
box.style.display="block";
box.textContent=message;
}

async function loadStudents(){

try{

const {data:{session},error:sessionError}
=await client.auth.getSession();

if(sessionError) throw sessionError;

if(!session){

location.href="admin-login.html";
return;
}

/*
Use the secure admin RPC directly.
It checks the administrator account on the server.
*/

const {data,error}
=await client.rpc(
"admin_get_student_applications"
);

if(error) throw error;

document.getElementById("loading").style.display="none";

const container=document.getElementById("applications");

if(!data || !data.length){

container.innerHTML=`
<div class="box">
No student applications have been submitted yet.
</div>`;
return;
}

container.innerHTML=data.map((item,index)=>{

const b=item.biodata || {};
const p=item.profile || {};
const enrollments=item.enrollments || [];
const admission=item.admission || null;

const departments=enrollments
.map(e=>e.departments?.name)
.filter(Boolean);

const admitted=
String(b.admission_status || "")
.toLowerCase()==="admitted";

return `

<div class="card">

<div class="student">

<div class="photo"></div>

<div>

<h3 class="name">
${esc(p.full_name || "Unnamed Student")}
</h3>

<div class="sid">
${esc(p.student_id || "No Student ID")}
</div>

<span class="status ${admitted?"admitted":""}">
${admitted?"ADMITTED":"SUBMITTED"}
</span>

</div>

</div>

<div class="grid">

${info("Email",p.email)}
${info("Phone",p.phone)}
${info("Date of Birth",b.date_of_birth)}
${info("Gender",b.gender)}
${info("Nationality",b.nationality)}
${info("Country",b.country || "Afghanistan")}
${info("Province / State",b.province)}
${info("District / City",b.district_city)}
${info("Study Level",p.study_level || "Beginner")}

</div>

<div class="section">

<strong>Residential Address</strong>

<div class="info">
${esc(b.residential_address || "—")}
</div>

</div>

<div class="section">

<strong>Next of Kin</strong>

<div class="grid">

${info("Name",b.next_of_kin_name)}
${info("Phone",b.next_of_kin_phone)}

</div>

</div>

<div class="section">

<strong>Departments</strong>

<div class="departments">

${
departments.length
?departments.map(d=>
`<span class="department">${esc(d)}</span>`
).join("")
:"No department information"
}

</div>

</div>

${
admission
?`
<div class="admission">

<strong>Admission Letter Issued</strong>

<p>
Issued:
${esc(formatDate(admission.issued_at))}
</p>

<p>
Downloads:
${esc(admission.download_count || 0)}
</p>

<p>
Last Downloaded:
${esc(formatDate(admission.last_downloaded_at))}
</p>

</div>
`
:""
}

<div class="actions">

${
b.application_pdf_path
?`
<button class="light"
onclick="downloadApplication('${esc(b.application_pdf_path)}')">
Download Application PDF
</button>
`
:""
}

${
admission
?`
<button class="gold"
onclick="downloadAdmission('${esc(admission.storage_path)}')">
Download Admission Letter
</button>
`
:`
<button class="green"
onclick="issueAdmission(${index})">
Issue Admission Letter
</button>
`
}

</div>

</div>

`;

}).join("");

window.studentApplications=data;

}catch(error){

console.error(error);

showError(
"Unable to load student applications.\n\n"+
(error.message || error)
);

}

}

function info(label,value){

return `
<div class="info">
<small>${esc(label)}</small>
<strong>${esc(value || "—")}</strong>
</div>
`;

}

function formatDate(value){

if(!value)return "—";

const d=new Date(value);

return isNaN(d.getTime())
?value
:d.toLocaleString();

}

async function downloadApplication(path){

try{

const {data,error}
=await client.storage
.from("student-applications")
.createSignedUrl(path,3600);

if(error)throw error;

window.open(data.signedUrl,"_blank");

}catch(error){

alert(
"Unable to open application PDF.\n\n"+
error.message
);

}

}

async function downloadAdmission(path){

try{

const {data,error}
=await client.storage
.from("admission-letters")
.createSignedUrl(path,3600);

if(error)throw error;

window.open(data.signedUrl,"_blank");

}catch(error){

alert(
"Unable to open admission letter.\n\n"+
error.message
);

}

}

async function issueAdmission(index){

const app=window.studentApplications[index];

const b=app.biodata;
const p=app.profile;

if(!p.id || !p.student_id){

alert("Student information is incomplete.");
return;

}

if(!confirm(
"Issue an admission letter for "+
(p.full_name || "this student")+
" ("+p.student_id+")?"
))return;

try{

const {data:{user},error:userError}
=await client.auth.getUser();

if(userError)throw userError;

const departments=(app.enrollments || [])
.map(e=>e.departments?.name)
.filter(Boolean);

const departmentText=
departments.length
?departments.join(", ")
:"Not specified";

const studyLevel=
p.study_level || "Beginner";

const {jsPDF}=await import(
"https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm"
);

const pdf=new jsPDF();

pdf.setFillColor(7,17,31);
pdf.rect(0,0,210,35,"F");

pdf.setTextColor(212,175,55);
pdf.setFontSize(22);
pdf.setFont("helvetica","bold");
pdf.text(
"RAYHAR ACADEMY",
105,15,
{align:"center"}
);

pdf.setTextColor(255,255,255);
pdf.setFontSize(10);
pdf.setFont("helvetica","normal");
pdf.text(
"For Knowledge and Leadership",
105,24,
{align:"center"}
);

pdf.setTextColor(17,24,39);
pdf.setFontSize(18);
pdf.setFont("helvetica","bold");
pdf.text(
"ADMISSION LETTER",
105,52,
{align:"center"}
);

pdf.setFontSize(11);
pdf.setFont("helvetica","normal");

pdf.text(
"Date: "+new Date().toLocaleDateString(),
20,68
);

pdf.setFont("helvetica","bold");
pdf.text("Student ID:",20,82);

pdf.setFont("helvetica","normal");
pdf.text(p.student_id,60,82);

pdf.setFont("helvetica","bold");
pdf.text("Student Name:",20,92);

pdf.setFont("helvetica","normal");
pdf.text(
p.full_name || "Student",
60,92
);

pdf.setFont("helvetica","bold");
pdf.text("Study Level:",20,102);

pdf.setFont("helvetica","normal");
pdf.text(studyLevel,60,102);

pdf.setFont("helvetica","bold");
pdf.text("Department(s):",20,112);

pdf.setFont("helvetica","normal");

const deptLines=
pdf.splitTextToSize(
departmentText,125
);

pdf.text(deptLines,60,112);

const text=
"Dear "+(p.full_name || "Student")+",\n\n"+
"We are pleased to inform you that you have been granted admission to RAYHAR ACADEMY. Your application and submitted student information have been received and processed by the Academy.\n\n"+
"Your official Student ID is "+p.student_id+". Please keep this Student ID safe, as it will be used for your student records and future Academy services.\n\n"+
"We welcome you to RAYHAR ACADEMY and wish you success in your studies and future academic journey.\n\n"+
"Sincerely,\nRAYHAR ACADEMY\nFor Knowledge and Leadership";

const startY=112+deptLines.length*6+18;

pdf.setFont("helvetica","normal");

pdf.text(
pdf.splitTextToSize(text,170),
20,startY
);

pdf.setFontSize(8);
pdf.setTextColor(100,100,100);

pdf.text(
"RAYHAR ACADEMY — Official Admission Document",
105,285,
{align:"center"}
);

const blob=pdf.output("blob");

const fileName=
"admission-letter-"+Date.now()+".pdf";

const path=p.id+"/"+fileName;

const upload=
await client.storage
.from("admission-letters")
.upload(
path,
blob,
{
contentType:"application/pdf",
upsert:true
}
);

if(upload.error)throw upload.error;

const remove=
await client
.from("admission_letters")
.delete()
.eq("student_id",p.id);

if(remove.error)throw remove.error;

const insert=
await client
.from("admission_letters")
.insert({
student_id:p.id,
file_name:fileName,
storage_path:path,
issued_by:user.id,
student_name:p.full_name,
student_id_number:p.student_id,
departments_text:departmentText,
study_level:studyLevel
})
.select()
.single();

if(insert.error)throw insert.error;

const update=
await client
.from("student_biodata")
.update({
admission_status:"admitted",
reviewed_at:new Date().toISOString(),
reviewed_by:user.id
})
.eq("student_id",p.id);

if(update.error)throw update.error;

alert("Admission letter issued successfully.");

loadStudents();

}catch(error){

console.error(error);

alert(
"Unable to issue admission letter.\n\n"+
error.message
);

}

}

async function logout(){

await client.auth.signOut();

location.href="admin-login.html";

}

loadStudents();

</script>

</body>
  </html>
