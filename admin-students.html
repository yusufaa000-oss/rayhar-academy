<style>

body{

.error{

.student-photo,

.student-photo{
  object-fit:cover;

.no-photo{

.student-name{

.section{

}

.section-title{

}

.departments{

.department{

.actions{

}

.green{

  color:white;
}

.gold{
  background:#d4af37;

}

/* =========================
   BIODATA MODAL
========================= */

.modal{

.modal-card{

}

.modal-head{

.modal-head h3{

}

.modal-photo img{

}

.modal-section-title{

  border-radius:7px;
  font-size:13px;

}

.document-status{
  padding:12px;
  background:#f8fafc;
  border-radius:7px;
}

.document-yes{

}

.document-no{

  }

  .actions button{

  }

</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">

      <img
        src="logo.jpg"
        alt="RAYHAR ACADEMY"
      >

      <div>

        <h1>RAYHAR ACADEMY</h1>

        <p>
          For Knowledge and Leadership
        </p>

      </div>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</header>


<main>

  <h2>
    Student Applications
  </h2>

  <div class="subtitle">

    Review submitted student biodata and manage admissions.
    Admission letters are generated automatically by the system.

  </div>

  <div
    id="errorBox"
    class="box error"
  ></div>

  <div
    id="loadingBox"
    class="box loading"
  >
    Loading student applications...
  </div>

  <div id="applications"></div>

</main>


<!-- =========================
     FULL BIODATA MODAL
========================= -->

<div
  id="detailsModal"
  class="modal"
  onclick="closeDetails(event)"
>

  <div
    class="modal-card"
    onclick="event.stopPropagation()"
  >

    <div class="modal-head">

      <h3>
        Full Student Biodata
      </h3>

      <button
        class="close-modal"
        onclick="hideDetails()"
      >
        Close
      </button>

    </div>

    <div id="detailsContent"></div>

  </div>

</div>


<script>

const client =
  window.supabaseClient;

let studentApplications = [];


/* =========================
   HELPERS
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function info(label,value){

  return `
    <div class="info">

      <small>
        ${esc(label)}
      </small>

      <strong>
        ${esc(value || "—")}
      </strong>

    </div>
  `;

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(isNaN(date.getTime())){
    return value;
  }

  return date.toLocaleString();

}


function showError(message){

  document
    .getElementById("loadingBox")
    .style.display="none";

  const box =
    document.getElementById("errorBox");

  box.style.display="block";

  box.textContent=message;

}


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications(){

  try{

    if(!client){

      throw new Error(
        "Supabase client was not loaded. Please check config.js."
      );

    }

    const sessionResult =
      await client.auth.getSession();

    if(sessionResult.error){
      throw sessionResult.error;
    }

    const session =
      sessionResult.data.session;

    if(!session){

      throw new Error(
        "No administrator session was found. Please log in again."
      );

    }

    const rpcPromise =
      client.rpc(
        "admin_get_student_applications"
      );

    const timeoutPromise =
      new Promise((_,reject)=>{

        setTimeout(()=>{

          reject(
            new Error(
              "The student applications request timed out. Please refresh the page."
            )
          );

        },15000);

      });

    const result =
      await Promise.race([
        rpcPromise,
        timeoutPromise
      ]);

    if(result.error){
      throw result.error;
    }

    if(!Array.isArray(result.data)){

      throw new Error(
        "The server returned an unexpected applications response."
      );

    }

    studentApplications =
      result.data;

    document
      .getElementById("loadingBox")
      .style.display="none";

    await renderApplications();

  }catch(error){

    console.error(
      "Application loading error:",
      error
    );

    showError(
      "Unable to load student applications.\n\n"+
      (
        error.message ||
        String(error)
      )
    );

  }

}


/* =========================
   STUDENT PHOTO
========================= */

async function getPhotoUrl(path){

  if(!path){
    return "";
  }

  try{

    const result =
      await client.storage
        .from("student-photos")
        .createSignedUrl(
          path,
          3600
        );

    if(result.error){

      console.error(
        "Photo error:",
        result.error
      );

      return "";

    }

    return (
      result.data?.signedUrl ||
      ""
    );

  }catch(error){

    console.error(
      "Photo error:",
      error
    );

    return "";

  }

}


/* =========================
   RENDER APPLICATIONS
========================= */

async function renderApplications(){

  const container =
    document.getElementById(
      "applications"
    );

  if(!studentApplications.length){

    container.innerHTML=`

      <div class="box">

        No student applications
        have been submitted yet.

      </div>

    `;

    return;

  }

  const photoUrls =
    await Promise.all(

      studentApplications.map(
        item =>
          getPhotoUrl(
            item.biodata?.photo_path
          )
      )

    );


  container.innerHTML =

    studentApplications.map(

      (item,index)=>{

        const biodata =
          item.biodata || {};

        const profile =
          item.profile || {};

        const enrollments =
          item.enrollments || [];

        const admission =
          item.admission || null;


        const departments =

          enrollments
            .map(
              enrollment =>
                enrollment.departments?.name
            )
            .filter(Boolean);


        const admitted =

          String(
            biodata.admission_status || ""
          ).toLowerCase()==="admitted";


        const photoUrl =
          photoUrls[index];


        const photoHtml =

          photoUrl

          ?

          `
            <img
              class="student-photo"
              src="${esc(photoUrl)}"
              alt="Student photo"
            >
          `

          :

          `
            <div class="no-photo">
              No Photo
            </div>
          `;


        return `

          <div class="card">

            <div class="student-header">

              ${photoHtml}

              <div>

                <h3 class="student-name">

                  ${esc(
                    profile.full_name ||
                    "Unnamed Student"
                  )}

                </h3>

                <div class="student-id">

                  ${esc(
                    profile.student_id ||
                    "No Student ID"
                  )}

                </div>

                <span
                  class="status ${
                    admitted
                      ? "admitted"
                      : ""
                  }"
                >

                  ${
                    admitted
                    ? "ADMITTED"
                    : "SUBMITTED"
                  }

                </span>

              </div>

            </div>


            <div class="grid">

              ${info(
                "Email",
                profile.email
              )}

              ${info(
                "Phone",
                profile.phone
              )}

              ${info(
                "Date of Birth",
                biodata.date_of_birth
              )}

              ${info(
                "Gender",
                biodata.gender
              )}

              ${info(
                "Nationality",
                biodata.nationality
              )}

              ${info(
                "Country",
                biodata.country
              )}

              ${info(
                "Province / State / Region",
                biodata.province
              )}

              ${info(
                "District / City / Area",
                biodata.district_city
              )}

              ${info(
                "Study Level",
                profile.study_level ||
                "Beginner"
              )}

            </div>


            <div class="section">

              <strong class="section-title">

                Residential Address

              </strong>

              <div class="info">

                ${esc(
                  biodata.residential_address ||
                  "—"
                )}

              </div>

            </div>


            <div class="section">

              <strong class="section-title">

                Next of Kin

              </strong>

              <div class="grid">

                ${info(
                  "Name",
                  biodata.next_of_kin_name
                )}

                ${info(
                  "Phone",
                  biodata.next_of_kin_phone
                )}

              </div>

            </div>


            <div class="section">

              <strong class="section-title">

                Departments

              </strong>

              <div class="departments">

                ${
                  departments.length

                  ?

                  departments
                    .map(
                      department => `
                        <span class="department">
                          ${esc(department)}
                        </span>
                      `
                    )
                    .join("")

                  :

                  "No department information"
                }

              </div>

            </div>


            ${
              admission

              ?

              `
                <div class="admission-box">

                  <strong>
                    Admission Letter Issued
                  </strong>

                  <p>
                    <strong>Issued:</strong>
                    ${esc(
                      formatDate(
                        admission.issued_at
                      )
                    )}
                  </p>

                  <p>
                    <strong>Downloads:</strong>
                    ${esc(
                      admission.download_count || 0
                    )}
                  </p>

                  <p>
                    <strong>Last Downloaded:</strong>
                    ${esc(
                      formatDate(
                        admission.last_downloaded_at
                      )
                    )}
                  </p>

                </div>
              `

              :

              ""
            }


            <div class="actions">

              <button
                class="light"
                onclick="viewDetails(${index})"
              >
                View Full Biodata
              </button>


              ${
                biodata.application_pdf_path

                ?

                `
                  <button
                    class="light"
                    onclick='downloadApplication(${JSON.stringify(
                      biodata.application_pdf_path
                    )})'
                  >
                    Download Application PDF
                  </button>
                `

                :

                ""
              }


              ${
                admission

                ?

                `
                  <button
                    class="gold"
                    onclick='downloadAdmission(${JSON.stringify(
                      admission.storage_path
                    )})'
                  >
                    Download Admission Letter
                  </button>

                  <button
                    class="green"
                    onclick="issueAdmission(${index})"
                  >
                    Re-issue Admission Letter
                  </button>
                `

                :

                `
                  <button
                    class="green"
                    onclick="issueAdmission(${index})"
                  >
                    Issue Admission Letter
                  </button>
                `
              }

            </div>

          </div>

        `;

      }

    ).join("");

}


/* =========================
   VIEW FULL BIODATA
========================= */

async function viewDetails(index){

  const application =
    studentApplications[index];

  if(!application){
    return;
  }

  const biodata =
    application.biodata || {};

  const profile =
    application.profile || {};

  const enrollments =
    application.enrollments || [];

  const admission =
    application.admission || null;


  const departments =

    enrollments
      .map(
        item =>
          item.departments?.name
      )
      .filter(Boolean);


  let photoUrl="";


  if(biodata.photo_path){

    photoUrl =
      await getPhotoUrl(
        biodata.photo_path
      );

  }


  const content =
    document.getElementById(
      "detailsContent"
    );


  const photoHtml =

    photoUrl

    ?

    `
      <img
        src="${esc(photoUrl)}"
        alt="Student photo"
      >
    `

    :

    `
      <div class="no-photo">
        No Photo
      </div>
    `;


  content.innerHTML = `

    <div class="modal-photo">

      ${photoHtml}

    </div>


    <div class="modal-section">

      <div class="modal-section-title">
        Personal Information
      </div>

      <div class="grid">

        ${info(
          "Full Name",
          profile.full_name
        )}

        ${info(
          "Student ID",
          profile.student_id
        )}

        ${info(
          "Email",
          profile.email
        )}

        ${info(
          "Phone",
          profile.phone
        )}

        ${info(
          "Date of Birth",
          biodata.date_of_birth
        )}

        ${info(
          "Gender",
          biodata.gender
        )}

        ${info(
          "Nationality",
          biodata.nationality
        )}

      </div>

    </div>


    <div class="modal-section">

      <div class="modal-section-title">
        Location Information
      </div>

      <div class="grid">

        ${info(
          "Country",
          biodata.country
        )}

        ${info(
          "State / Province / Region",
          biodata.province
        )}

        ${info(
          "District / City / Area",
          biodata.district_city
        )}

      </div>

    </div>


    <div class="modal-section">

      <div class="modal-section-title">
        Academic Information
      </div>

      <div class="grid">

        ${info(
          "Study Level",
          profile.study_level ||
          "Beginner"
        )}

        ${info(
          "Admission Status",
          biodata.admission_status ||
          "Submitted"
        )}

        ${info(
          "Submitted",
          formatDate(
            biodata.submitted_at
          )
        )}

        ${info(
          "Last Updated",
          formatDate(
            biodata.updated_at
          )
        )}

        ${info(
          "Reviewed",
          formatDate(
            biodata.reviewed_at
          )
        )}

      </div>


      <div class="section">

        <strong class="section-title">
                  Documents
      </div>

      <div class="grid">

        <div class="info-card">
          <div class="info-label">
            Student Photo
          </div>

          <div class="info-value">
            ${
              photoUrl
                ? `<img
                    src="${photoUrl}"
                    alt="Student Photo"
                    class="biodata-photo"
                  >`
                : `<span class="muted">
                    No photo uploaded
                  </span>`
            }
          </div>
        </div>

        <div class="info-card">
          <div class="info-label">
            Application Form
          </div>

          <div class="info-value">
            ${
              biodata.application_pdf_path
                ? `
                  <button
                    class="small-btn"
                    onclick="downloadApplication('${escapeHtml(
                      biodata.application_pdf_path
                    )}')"
                  >
                    Download Application PDF
                  </button>
                `
                : `
                  <span class="muted">
                    No application PDF
                  </span>
                `
            }
          </div>
        </div>

        <div class="info-card">
          <div class="info-label">
            Admission Letter
          </div>

          <div class="info-value">
            ${
              admissionLetter
                ? `
                  <button
                    class="small-btn"
                    onclick="downloadAdmission('${escapeHtml(
                      admissionLetter.storage_path
                    )}')"
                  >
                    Download Admission Letter
                  </button>
                `
                : `
                  <span class="muted">
                    Not issued yet
                  </span>
                `
            }
          </div>
        </div>

      </div>

    </div>


    <div class="modal-section">

      <div class="modal-section-title">
        Next of Kin
      </div>

      <div class="grid">

        ${info(
          "Name",
          biodata.next_of_kin_name
        )}

        ${info(
          "Phone",
          biodata.next_of_kin_phone
        )}

      </div>

    </div>


    <div class="modal-section">

      <div class="modal-section-title">
        Address
      </div>

      <div class="grid">

        ${info(
          "Residential Address",
          biodata.residential_address
        )}

      </div>

    </div>


    <div class="modal-section">

      <div class="modal-section-title">
        Admission Letter Information
      </div>

      <div class="grid">

        ${info(
          "Student ID",
          profile.student_id
        )}

        ${info(
          "Letter Status",
          admissionLetter
            ? "Issued"
            : "Not Issued"
        )}

        ${info(
          "Issued Date",
          admissionLetter
            ? formatDate(
                admissionLetter.issued_at
              )
            : "—"
        )}

        ${info(
          "Download Count",
          admissionLetter
            ? admissionLetter.download_count
            : "0"
        )}

        ${info(
          "Last Downloaded",
          admissionLetter &&
          admissionLetter.last_downloaded_at
            ? formatDate(
                admissionLetter.last_downloaded_at
              )
            : "Never"
        )}

      </div>

    </div>

  </div>

  <div class="modal-footer">

    <button
      class="secondary-btn"
      onclick="closeModal()"

      Close
    </button>

    <button
      class="primary-btn"
      onclick="issueAdmission('${profile.id}')"
    >
      ${
        admissionLetter
          ? "Re-issue Admission Letter"
          : "Issue Admission Letter"
      }
    </button>

  </div>

</div>
<script>

async function issueAdmission(studentId) {

  const profile =
    studentApplications.find(
      item => item.profile.id === studentId
    )?.profile;

  if (!profile) {
    alert("Student information could not be found.");
    return;
  }

  const application =
    studentApplications.find(
      item => item.profile.id === studentId
    );

  if (!application) {
    alert("Application information could not be found.");
    return;
  }

  const confirmed = confirm(
    application.admissionLetter
      ? "This will issue a new admission letter for this student. Continue?"
      : "Issue an admission letter for this student?"
  );

  if (!confirmed) return;

  try {

    showLoading("Generating admission letter...");

    const biodata = application.biodata;

    if (!biodata) {
      throw new Error(
        "Student biodata could not be found."
      );
    }

    /*
     * Generate the admission letter PDF
     */
    const pdfBlob =
      await createAdmissionPDF(
        profile,
        application
      );

    /*
     * Create a unique storage path.
     * The student's permanent Student ID does not change.
     */
    const timestamp =
      Date.now();

    const storagePath =
      `${profile.id}/admission-letter-${timestamp}.pdf`;

    /*
     * Upload the newly generated PDF
     */
    const {
      error: uploadError
    } =
      await supabaseClient.storage
        .from("admission-letters")
        .upload(
          storagePath,
          pdfBlob,
          {
            contentType: "application/pdf",
            upsert: false
          }
        );

    if (uploadError) {
      throw uploadError;
    }

    /*
     * If an old admission record exists,
     * remove only the database record.
     *
     * The old PDF remains unchanged in storage.
     */
    const {
      error: deleteError
    } =
      await supabaseClient
        .from("admission_letters")
        .delete()
        .eq(
          "student_id",
          profile.id
        );

    if (deleteError) {
      throw deleteError;
    }

    /*
     * Create the new active admission-letter record.
     */
    const {
      error: insertError
    } =
      await supabaseClient
        .from("admission_letters")
        .insert({
          student_id:
            profile.id,

          file_name:
            "RAYHAR-Academy-Admission-Letter.pdf",

          storage_path:
            storagePath,

          issued_by:
            currentUser.id,

          student_name:
            profile.full_name,

          student_id_number:
            profile.student_id,

          departments_text:
            application.departmentsText ||
            profile.department ||
            "Not specified",

          study_level:
            profile.study_level ||
            "Beginner",

          issued_at:
            new Date().toISOString(),

          download_count:
            0
        });

    if (insertError) {
      throw insertError;
    }

    /*
     * Update biodata status.
     */
    const {
      error: biodataError
    } =
      await supabaseClient
        .from("student_biodata")
        .update({
          admission_status:
            "admitted",

          reviewed_at:
            new Date().toISOString(),

          reviewed_by:
            currentUser.id,

          updated_at:
            new Date().toISOString()
        })
        .eq(
          "student_id",
          profile.id
        );

    if (biodataError) {
      throw biodataError;
    }

    alert(
      application.admissionLetter
        ? "Admission letter re-issued successfully."
        : "Admission letter issued successfully."
    );

    closeModal();

    await loadApplications();

  } catch (error) {

    console.error(
      "Admission issuing error:",
      error
    );

    alert(
      "Unable to issue the admission letter.\n\n" +
      (
        error.message ||
        "Please try again."
      )
    );

  } finally {

    hideLoading();

  }
}

/* =========================================
   IMAGE LOADER
========================================= */

async function loadImageAsDataURL(
  imagePath
) {

  const response =
    await fetch(
      imagePath
    );

  if (!response.ok) {
    throw new Error(
      "Unable to load image."
    );
  }

  const blob =
    await response.blob();

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        blob
      );

    }
  );
}

        .from(

      throw error;

  } catch (error) {

  }
}

/* =========================================
   MODAL CLOSE
========================================= */

function closeModal() {

  const modal =
    document.getElementById(
      "biodataModal"
    );

  if (modal) {
    modal.classList.remove(
      "active"
    );
  }

}


/* =========================================
   LOADING HELPERS
========================================= */

function showLoading(
  message = "Please wait..."
) {

  let loading =
    document.getElementById(
      "loadingOverlay"
    );

  if (!loading) {

    loading =
      document.createElement(
        "div"
      );

    loading.id =
      "loadingOverlay";

    loading.innerHTML = `
      <div class="loading-box">
        <div class="spinner"></div>
        <div>${message}</div>
      </div>
    `;

    document.body.appendChild(
      loading
    );

  } else {

    const text =
      loading.querySelector(
        ".loading-box div:last-child"
      );

    if (text) {
      text.textContent =
        message;
    }

  }

  loading.style.display =
    "flex";
}


function hideLoading() {

  const loading =
    document.getElementById(
      "loadingOverlay"
    );

  if (loading) {
    loading.style.display =
      "none";
  }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   LOGOUT
========================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "admin-login.html";

}


/* =========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================= */

document.addEventListener(
  "click",
  function(event) {

    const modal =
      document.getElementById(
        "biodataModal"
      );

    if (
      modal &&
      event.target === modal
    ) {
      closeModal();
    }

  }
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {
      closeModal();
    }

  }
);
