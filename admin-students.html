  </style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">

      <img
        src="logo.jpg"
        alt="RAYHAR ACADEMY"
      >

      <div>
        <h1>RAYHAR ACADEMY</h1>
        <p>Student Applications</p>
      </div>

</header>

<div class="container">

  <h2>Student Applications</h2>

  <p class="intro">
    Review submitted student biodata and manage admissions.
    Admission letters are generated automatically by the system.
  </p>

  <div
    id="message"
    class="message"
  ></div>

  <div
    id="loading"
    class="loading"
  >
    Loading student applications...
  </div>

  <div

    class="applications"
  ></div>

</div>

<script src="config.js"></script>

<script>

const client = window.supabaseClient;

const applicationsContainer =
  document.getElementById("applications");

const loading =
  document.getElementById("loading");

const message =
  document.getElementById("message");

function showMessage(text, type) {

  message.textContent = text;
  message.className =
    "message " + type;

  message.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(value) {

  if (!value) {
    return "Not provided";
  }

  return new Date(value).toLocaleDateString(
    "en-US",
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );
}

function formatDateTime(value) {

  if (!value) {
    return "Never";
  }

  return new Date(value).toLocaleString(
    "en-US",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );
}

async function checkAdmin() {

  const {
    data: {
      user
    }
  } = await client.auth.getUser();

  if (!user) {

    window.location.href =
      "admin-login.html";

    return null;
  }

  const {
    data: profile,
    error
  } = await client
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (error ||
      !profile ||
      profile.role !== "admin") {

    await client.auth.signOut();

    window.location.href =
      "student-auth.html";

    return null;
  }

  return user;
}

async function getPhotoUrl(path) {

  if (!path) return null;

  const {
    data,
    error
  } = await client.storage
    .from("student-photos")
    .createSignedUrl(path, 3600);

  if (error) {
    console.error(error);
    return null;
  }

  return data.signedUrl;
}

async function downloadApplicationPDF(path, studentName) {

  if (!path) {
    showMessage(
      "The application PDF is not available.",
      "error"
    );
    return;
  }

  const {
    data,
    error
  } = await client.storage
    .from("student-applications")
    .download(path);

  if (error) {
    showMessage(
      "Could not download the application PDF: " +
      error.message,
      "error"
    );
    return;
  }

  const url =
    URL.createObjectURL(data);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "RAYHAR-Application-" +
    studentName.replace(/\s+/g, "-") +
    ".pdf";

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);
}

async function generateAdmissionLetter(application) {

  const button =
    document.getElementById(
      "admit-" + application.student_id
    );

  if (button) {

    button.disabled = true;

    button.textContent =
      "Generating...";
  }

  try {

    const {
      jsPDF
    } = window.jspdf;

    const pdf =
      new jsPDF();

    const gold =
      [212, 175, 55];

    const navy =
      [7, 17, 31];

    /*
      Get student's departments.
    */

    const {
      data: enrollments,
      error: enrollmentError
    } = await client
      .from("enrollments")
      .select(`
        study_level,
        departments (
          name
        )
      `)
      .eq(
        "student_id",
        application.student_id
      );

    if (enrollmentError) {
      throw enrollmentError;
    }

    const departments =
      (enrollments || [])
        .map(item =>
          item.departments
            ? item.departments.name
            : null
        )
        .filter(Boolean);

    const studyLevel =
      application.study_level ||
      (enrollments &&
       enrollments[0] &&
       enrollments[0].study_level) ||
      "Not specified";

    /*
      PDF background.
    */

    pdf.setFillColor(...navy);

    pdf.rect(
      0,
      0,
      210,
      297,
      "F"
    );

    pdf.setFillColor(
      255,
      255,
      255
    );

    pdf.roundedRect(
      10,
      10,
      190,
      277,
      4,
      4,
      "F"
    );

    /*
      Header.
    */

    pdf.setTextColor(...gold);

    pdf.setFont(
      "helvetica",
      "bold"
    );

    pdf.setFontSize(23);

    pdf.text(
      "RAYHAR ACADEMY",
      105,
      28,
      {
        align: "center"
      }
    );

    pdf.setFontSize(11);

    pdf.setTextColor(
      80,
      80,
      80
    );

    pdf.setFont(
      "helvetica",
      "normal"
    );

    pdf.text(
      "For Knowledge and Leadership",
      105,
      36,
      {
        align: "center"
      }
    );

    pdf.setDrawColor(...gold);

    pdf.setLineWidth(1);

    pdf.line(
      25,
      43,
      185,
      43
    );

    /*
      Title.
    */

    pdf.setTextColor(
      25,
      25,
      25
    );

    pdf.setFont(
      "helvetica",
      "bold"
    );

    pdf.setFontSize(20);

    pdf.text(
      "ADMISSION LETTER",
      105,
      62,
      {
        align: "center"
      }
    );

    pdf.setFontSize(10);

    pdf.setFont(
      "helvetica",
      "normal"
    );

    pdf.text(
      "Date: " +
      formatDate(
        new Date()
          .toISOString()
          .split("T")[0]
      ),
      25,
      77
    );

    /*
      Student details.
    */

    let y = 95;

    function addLine(
      label,
      value
    ) {

      pdf.setFont(
        "helvetica",
        "bold"
      );

      pdf.text(
        label,
        30,
        y
      );

      pdf.setFont(
        "helvetica",
        "normal"
      );

      pdf.text(
        String(value || "Not specified"),
        75,
        y
      );

      y += 10;
    }

    addLine(
      "Student ID:",
      application.student_id_number
    );

    addLine(
      "Student Name:",
      application.student_name
    );

    addLine(
      "Email:",
      application.email
    );

    addLine(
      "Study Level:",
      studyLevel
    );

    addLine(
      "Department(s):",
      departments.join(", ")
    );

    /*
      Admission message.
    */

    y += 10;

    pdf.setFont(
      "helvetica",
      "normal"
    );

    pdf.setFontSize(12);

    const messageText =
      "Dear " +
      application.student_name +
      ",";

    pdf.text(
      messageText,
      30,
      y
    );

    y += 14;

    const admissionText =
      "We are pleased to inform you that you have been admitted " +
      "to RAYHAR ACADEMY. Your admission has been recorded under " +
      "the Student ID shown above.";

    const wrapped =
      pdf.splitTextToSize(
        admissionText,
        150
      );

    pdf.text(
      wrapped,
      30,
      y,
      {
        lineHeightFactor: 1.6
      }
    );

    y +=
      wrapped.length * 8 +
      10;

    const nextText =
      "Please keep your Student ID safe, as it will be used " +
      "for your student records and future academic services.";

    const wrapped2 =
      pdf.splitTextToSize(
        nextText,
        150
      );

    pdf.text(
      wrapped2,
      30,
      y,
      {
        lineHeightFactor: 1.6
      }
    );

    y +=
      wrapped2.length * 8 +
      20;

    /*
      Closing.
    */

    pdf.text(
      "Congratulations and welcome to RAYHAR ACADEMY.",
      30,
      y
    );

    y += 25;

    pdf.setFont(
      "helvetica",
      "bold"
    );

    pdf.text(
      "RAYHAR ACADEMY",
      30,
      y
    );

    pdf.setFont(
      "helvetica",
      "normal"
    );

    pdf.text(
      "Authorized Admission Office",
      30,
      y + 8
    );

    /*
      Footer.
    */

    pdf.setFontSize(8);

    pdf.setTextColor(
      110,
      110,
      110
    );

    pdf.text(
      "This admission letter was automatically generated by RAYHAR ACADEMY.",
      105,
      275,
      {
        align: "center"
      }
    );

    /*
      Convert PDF to blob.
    */

    const blob =
      pdf.output("blob");

    /*
      Create unique storage path.
    */

    const path =
      application.student_id +
      "/admission-letter-" +
      Date.now() +
      ".pdf";

    /*
      Upload PDF.
    */

    const {
      error: uploadError
    } = await client
      .storage
      .from("admission-letters")
      .upload(
        path,
        blob,
        {
          contentType:
            "application/pdf",
          upsert: false
        }
      );

    if (uploadError) {
      throw uploadError;
    }

    /*
      Remove previous database record
      if one exists.
    */

    const {
      data: existing
    } = await client
      .from("admission_letters")
      .select("id")
      .eq(
        "student_id",
        application.student_id
      )
      .maybeSingle();

    if (existing) {

      const {
        error: deleteError
      } = await client
        .from("admission_letters")
        .delete()
        .eq(
          "id",
          existing.id
        );

      if (deleteError) {
        throw deleteError;
      }
    }

    /*
      Save new admission letter record.
    */

    const {
      error: insertError
    } = await client
      .from("admission_letters")
      .insert({

        student_id:
          application.student_id,

        file_name:
          "Admission Letter - " +
          application.student_id_number +
          ".pdf",

        storage_path:
          path,

        issued_by:
          (await client.auth.getUser())
            .data.user.id,

        student_name:
          application.student_name,

        student_id_number:
          application.student_id_number,

        departments_text:
          departments.join(", "),

        study_level:
          studyLevel

      });

    if (insertError) {
      throw insertError;
    }

    /*
      Mark application as reviewed/admitted.
    */

    const {
      error: updateError
    } = await client
      .from("student_biodata")
      .update({

        admission_status:
          "admitted",

        reviewed_at:
          new Date().toISOString(),

        reviewed_by:
          (await client.auth.getUser())
            .data.user.id

      })
      .eq(
        "student_id",
        application.student_id
      );

    if (updateError) {
      throw updateError;
    }

    showMessage(
      "Admission letter generated and sent to " +
      application.student_name +
      ".",
      "success"
    );

    await loadApplications();

  } catch (error) {

    console.error(error);

    showMessage(
      "Admission letter could not be generated: " +
      error.message,
      "error"
    );

    if (button) {

      button.disabled = false;

      button.textContent =
        "Generate & Send Admission Letter";
    }
  }
}
