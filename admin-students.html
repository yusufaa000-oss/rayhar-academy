<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Applications | RAYHAR ACADEMY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #172033;
    }

    header {
      background: #07111f;
      color: white;
      padding: 18px 20px;
      border-bottom: 3px solid #d4af37;
    }

    .header-inner {
      max-width: 1150px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 50%;
      background: white;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      color: #d4af37;
      font-size: 12px;
      margin-top: 3px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-btn {
      background: transparent;
      border: 1px solid #d4af37;
      color: white;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .header-btn:hover {
      background: #d4af37;
      color: #07111f;
    }

    main {
      max-width: 1150px;
      margin: 30px auto;
      padding: 0 18px 50px;
    }

    .page-title {
      background: linear-gradient(135deg, #07111f, #10243b);
      color: white;
      padding: 27px;
      border-radius: 14px;
      margin-bottom: 22px;
    }

    .page-title h2 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #dce4ee;
      line-height: 1.6;
    }

    .message {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #e3aaaa;
      color: #9b2226;
    }

    .success {
      background: #edf9f0;
      border: 1px solid #abd9b7;
      color: #176b36;
    }

    .loading {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      color: #666;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      color: #666;
    }

    .application {
      background: white;
      border: 1px solid #e1e4e8;
      border-radius: 13px;
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .application-header {
      background: #faf8ef;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .student-heading {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .student-photo {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      border: 2px solid #d4af37;
      background: #eee;
    }

    .student-heading h3 {
      color: #07111f;
      margin-bottom: 5px;
    }

    .student-heading p {
      color: #666;
      font-size: 13px;
      margin-top: 3px;
    }

    .status {
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status-submitted {
      background: #fff4d6;
      color: #745600;
    }

    .status-admitted {
      background: #e8f7ed;
      color: #176b36;
    }

    .application-body {
      padding: 20px;
    }

    .section-title {
      color: #07111f;
      font-size: 16px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 8px;
      margin: 5px 0 14px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 25px;
      margin-bottom: 22px;
    }

    .detail {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .detail-label {
      display: block;
      color: #777;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .detail-value {
      font-weight: 600;
      word-break: break-word;
    }

    .departments {
      margin-bottom: 22px;
    }

    .department {
      display: inline-block;
      background: #f5edcf;
      color: #594600;
      padding: 8px 10px;
      border-radius: 6px;
      margin: 3px;
      font-size: 13px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .action-btn {
      border: none;
      padding: 11px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .review-btn {
      background: #07111f;
      color: white;
    }

    .review-btn:hover {
      background: #162f4d;
    }

    .pdf-btn {
      background: #eee;
      color: #172033;
    }

    .pdf-btn:hover {
      background: #ddd;
    }

    .admit-btn {
      background: #d4af37;
      color: #07111f;
    }

    .admit-btn:hover {
      background: #c39d25;
    }

    .admit-btn:disabled,
    .action-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .admission-info {
      margin-top: 15px;
      padding: 13px;
      background: #edf9f0;
      border: 1px solid #b8dfc2;
      color: #176b36;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.6;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,.65);
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      max-width: 850px;
      margin: 20px auto;
      background: white;
      border-radius: 13px;
      overflow: hidden;
    }

    .modal-header {
      background: #07111f;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 19px;
    }

    .close {
      background: transparent;
      border: none;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .modal-body {
      padding: 22px;
    }

    .large-photo {
      display: block;
      max-width: 180px;
      max-height: 220px;
      margin: 0 auto 20px;
      border-radius: 8px;
      border: 2px solid #d4af37;
      object-fit: cover;
    }

    .modal-section {
      margin-bottom: 22px;
    }

    .modal-section h4 {
      color: #07111f;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 7px;
      margin-bottom: 10px;
    }

    .modal-row {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .modal-row span:first-child {
      color: #777;
    }

    .modal-row span:last-child {
      font-weight: 600;
      text-align: right;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 25px;
    }

    @media (max-width: 750px) {
      .details-grid {
        grid-template-columns: 1fr;
      }

      .application-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .modal-row {
        flex-direction: column;
        gap: 3px;
      }

      .modal-row span:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img src="logo.jpg" alt="RAYHAR ACADEMY Logo">

      <div>
        <h1>RAYHAR ACADEMY</h1>
        <p>For Knowledge and Leadership</p>
      </div>
    </div>

    <div class="header-buttons">
      <button class="header-btn"
              onclick="window.location.href='admin-portal.html'">
        Admin Portal
      </button>

      <button class="header-btn" id="logoutBtn">
        Logout
      </button>
    </div>

  </div>
</header>


<main>

  <section class="page-title">
    <h2>Student Applications</h2>
    <p>
      Review submitted student biodata and manage admissions.
      Admission letters are generated automatically by the system.
    </p>
  </section>


  <div id="errorMessage" class="message error"></div>
  <div id="successMessage" class="message success"></div>


  <div id="loading" class="loading">
    Loading student applications...
  </div>


  <div id="applications"></div>

</main>


<footer>
  © <span id="year"></span> RAYHAR ACADEMY — For Knowledge and Leadership
</footer>


<!-- REVIEW MODAL -->

<div id="reviewModal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h3>Student Application</h3>

      <button class="close" onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="modal-body" id="modalBody"></div>

  </div>

</div>


<script>

const client = window.supabaseClient;

let applications = [];

document.getElementById("year").textContent =
  new Date().getFullYear();


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function showError(message) {

  const box =
    document.getElementById("errorMessage");

  box.textContent = message;
  box.style.display = "block";

}


function showSuccess(message) {

  const box =
    document.getElementById("successMessage");

  box.textContent = message;
  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 6000);

}


function formatDate(value) {

  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric"
  });

}


function formatDateTime(value) {

  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return date.toLocaleString();

}


async function checkAdmin() {

  if (!client) {

    document.getElementById("loading").style.display = "none";

    showError(
      "Supabase configuration could not be loaded."
    );

    return;

  }


  const {
    data: { user },
    error: userError
  } = await client.auth.getUser();


  if (userError || !user) {

    window.location.href =
      "admin-login.html";

    return;

  }


  const {
    data: profile,
    error: profileError
  } = await client
    .from("profiles")
    .select("id, role")
    .eq("id", user.id)
    .single();


  if (profileError) {

    document.getElementById("loading").style.display = "none";

    showError(
      "Unable to verify administrator access."
    );

    return;

  }


  if (profile.role !== "admin") {

    await client.auth.signOut();

    window.location.href =
      "admin-login.html";

    return;

  }


  await loadApplications();

}


async function loadApplications() {

  const loading =
    document.getElementById("loading");

  const container =
    document.getElementById("applications");


  loading.style.display = "block";
  container.innerHTML = "";


  /*
    IMPORTANT:
    We deliberately query student_biodata separately
    from profiles. This avoids relying on a Supabase
    foreign-key relationship for the display.
  */

  const {
    data: biodata,
    error: biodataError
  } = await client
    .from("student_biodata")
    .select("*")
    .order("submitted_at", {
      ascending: false
    });


  if (biodataError) {

    console.error(biodataError);

    loading.style.display = "none";

    showError(
      "Unable to load student applications: " +
      biodataError.message
    );

    return;

  }


  if (!biodata || biodata.length === 0) {

    loading.style.display = "none";

    container.innerHTML = `
      <div class="empty">
        <h3 style="margin-bottom:8px;">
          No Student Applications
        </h3>

        <p>
          No student has submitted biodata yet.
        </p>
      </div>
    `;

    return;

  }


  const studentIds =
    biodata.map(item => item.student_id);


  const {
    data: profiles,
    error: profileError
  } = await client
    .from("profiles")
    .select(
      "id, full_name, email, phone, student_id, study_level, status"
    )
    .in("id", studentIds);


  if (profileError) {

    console.error(profileError);

    loading.style.display = "none";

    showError(
      "The biodata was found, but student profile information could not be loaded: " +
      profileError.message
    );

    return;

  }


  const profileMap = {};

  (profiles || []).forEach(profile => {

    profileMap[profile.id] = profile;

  });


  applications = biodata.map(item => {

    return {
      biodata: item,
      profile: profileMap[item.student_id] || null
    };

  });


  /*
    Get department/enrollment information
    separately.
  */

  const {
    data: enrollments,
    error: enrollmentError
  } = await client
    .from("enrollments")
    .select(`
      student_id,
      study_level,
      status,
      department_id,
      departments (
        name
      )
    `)
    .in("student_id", studentIds);


  if (!enrollmentError && enrollments) {

    applications.forEach(application => {

      application.enrollments =
        enrollments.filter(
          enrollment =>
            enrollment.student_id ===
            application.biodata.student_id
        );

    });

  } else {

    applications.forEach(application => {
      application.enrollments = [];
    });

  }


  /*
    Get admission letters separately.
  */

  const {
    data: letters,
    error: lettersError
  } = await client
    .from("admission_letters")
    .select("*")
    .in("student_id", studentIds);


  if (!lettersError && letters) {

    applications.forEach(application => {

      application.admission =
        letters.find(
          letter =>
            letter.student_id ===
            application.biodata.student_id
        ) || null;

    });

  } else {

    applications.forEach(application => {
      application.admission = null;
    });

  }


  await createPhotoUrls();

  renderApplications();

  loading.style.display = "none";

}


async function createPhotoUrls() {

  for (const application of applications) {

    const path =
      application.biodata.photo_path;

    if (!path) {

      application.photoUrl = "";

      continue;

    }


    const {
      data,
      error
    } = await client.storage
      .from("student-photos")
      .createSignedUrl(path, 3600);


    if (!error && data) {

      application.photoUrl =
        data.signedUrl;

    } else {

      application.photoUrl = "";

    }

  }

}


function renderApplications() {

  const container =
    document.getElementById("applications");


  if (!applications.length) {

    container.innerHTML = `
      <div class="empty">
        No applications found.
      </div>
    `;

    return;

  }


  container.innerHTML =
    applications.map((application, index) => {

      const biodata =
        application.biodata;

      const profile =
        application.profile || {};

      const admission =
        application.admission;


      const name =
        profile.full_name ||
        "Student";


      const studentId =
        profile.student_id ||
        "Not available";


      const email =
        profile.email ||
        "—";


      const status =
        biodata.admission_status ||
        "submitted";


      const isAdmitted =
        status === "admitted";


      const departments =
        application.enrollments || [];


      const departmentHTML =
        departments.length
          ? departments.map(item => `
              <span class="department">
                ${escapeHTML(
                  item.departments?.name ||
                  "Department"
                )}
              </span>
            `).join("")
          : `
              <span style="color:#777;">
                No department recorded
              </span>
            `;


      return `

        <article class="application">

          <div class="application-header">

            <div class="student-heading">

              ${
                application.photoUrl
                ?
                `<img
                  class="student-photo"
                  src="${escapeHTML(application.photoUrl)}"
                  alt="Student photograph"
                >`
                :
                `<div
                  class="student-photo"
                  style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#888;
                    font-size:11px;
                    text-align:center;
                  "
                >
                  No Photo
                </div>`
              }

              <div>

                <h3>
                  ${escapeHTML(name)}
                </h3>

                <p>
                  Student ID:
                  <strong>
                    ${escapeHTML(studentId)}
                  </strong>
                </p>

                <p>
                  ${escapeHTML(email)}
                </p>

              </div>

            </div>


            <span class="status ${
              isAdmitted
                ? "status-admitted"
                : "status-submitted"
            }">

              ${
                isAdmitted
                  ? "ADMITTED"
                  : "SUBMITTED"
              }

            </span>

          </div>


          <div class="application-body">

            <h4 class="section-title">
              Application Information
            </h4>


            <div class="details-grid">

              <div class="detail">
                <span class="detail-label">
                  Phone
                </span>

                <span class="detail-value">
                  ${escapeHTML(
                    profile.phone ||
                    biodata.next_of_kin_phone ||
                    "—"
                  )}
                </span>
              </div>


              <div class="detail">
                <span class="detail-label">
                  Date of Birth
                </span>

                <span class="detail-value">
                  ${escapeHTML(
                    biodata.date_of_birth ||
                    "—"
                  )}
                </span>
              </div>


              <div class="detail">
                <span class="detail-label">
                  Gender
                </span>

                <span class="detail-value">
                  ${escapeHTML(
                    biodata.gender ||
                    "—"
                  )}
                </span>
              </div>


              <div class="detail">
                <span class="detail-label">
                  Nationality
                </span>

                <span class="detail-value">
                  ${escapeHTML(
                    biodata.nationality ||
                    "—"
                  )}
                </span>
              </div>


              <div class="detail">
                <span class="detail-label">
                  Country
                </span>

                <span class="detail-value">
                  ${escapeHTML(
                    biodata.country ||
