<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Account | RAYHAR ACADEMY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
    }

    .container {
      width: min(500px, 92%);
      margin: 50px auto;
    }

    .card {
      background: #111827;
      border: 1px solid #263044;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 10px;
    }

    .logo h1 {
      color: #d4af37;
      margin: 10px 0 5px;
    }

    .logo p {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
    }

    h2 {
      color: #d4af37;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #374151;
      background: #0b0f19;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #c9a227;
      color: #05070c;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e0c04d;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #12351f;
      color: #8ff0a4;
    }

    .error {
      display: block;
      background: #3a1515;
      color: #ff9b9b;
    }

    .profile {
      display: none;
    }

    .profile-item {
      background: #0b0f19;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
    }

    .profile-item small {
      display: block;
      color: #888;
      margin-bottom: 4px;
    }

    .portal-btn {
      background: #d4af37;
    }

    .logout-btn {
      background: #555;
      color: white;
    }

    .note {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <img src="logo.jpg" alt="RAYHAR ACADEMY Logo">
    <h1>RAYHAR ACADEMY</h1>
    <p>FOR KNOWLEDGE AND LEADERSHIP</p>
  </div>


  <!-- LOGIN -->
  <div class="card" id="loginCard">

    <h2>Student Login</h2>

    <form id="loginForm">

      <label for="loginEmail">Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
      >

      <label for="loginPassword">Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="loginMessage" class="message"></div>

    <p class="note">
      Use your registered student email and password.
    </p>

  </div>


  <!-- PROFILE -->
  <div class="card profile" id="profileCard">

    <h2>Welcome, Student 👋</h2>

    <div class="profile-item">
      <small>Student ID</small>
      <span id="studentId">—</span>
    </div>

    <div class="profile-item">
      <small>Full Name</small>
      <span id="studentName">—</span>
    </div>

    <div class="profile-item">
      <small>Email</small>
      <span id="studentEmail">—</span>
    </div>

    <button
      class="portal-btn"
      onclick="openPortal()"
    >
      Open Student Portal
    </button>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<script>

  const client = window.supabaseClient;


  /*
   * SHOW MESSAGE
   */
  function showMessage(element, message, type) {

    element.textContent = message;

    element.className = "message " + type;

  }


  /*
   * LOGIN
   */
  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const message =
        document.getElementById("loginMessage");

      message.className = "message";
      message.textContent = "";

      if (!client) {

        showMessage(
          message,
          "Supabase configuration could not be loaded.",
          "error"
        );

        return;
      }

      showMessage(
        message,
        "Logging in...",
        "success"
      );


      try {

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        if (!data.session) {

          throw new Error(
            "Login was not completed. Please try again."
          );

        }


        showMessage(
          message,
          "Login successful! Opening your student portal...",
          "success"
        );


        /*
         * AUTOMATICALLY OPEN STUDENT PORTAL
         */
        setTimeout(function() {

          window.location.replace(
            "student-portal.html"
          );

        }, 700);


      } catch (error) {

        console.error("Login error:", error);

        showMessage(
          message,
          error.message || "Unable to log in.",
          "error"
        );

      }

    });


  /*
   * OPEN PORTAL
   */
  function openPortal() {

    window.location.replace(
      "student-portal.html"
    );

  }


  /*
   * LOGOUT
   */
  async function logout() {

    try {

      await client.auth.signOut();

    } catch (error) {

      console.error("Logout error:", error);

    }

    window.location.replace(
      "student-auth.html"
    );

  }


  /*
   * CHECK EXISTING SESSION
   */
  async function checkExistingSession() {

    if (!client) return;

    try {

      const {
        data: { session }
      } = await client.auth.getSession();


      /*
       * If already logged in,
       * automatically go to portal.
       */
      if (session) {

        window.location.replace(
          "student-portal.html"
        );

      }

    } catch (error) {

      console.error(
        "Session check error:",
        error
      );

    }

  }


  checkExistingSession();

</script>

</body>
</html>
