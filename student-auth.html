<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | RAYHAR ACADEMY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    :root {
      --navy: #071a3a;
      --navy-dark: #041127;
      --gold: #d4af37;
      --gold-light: #f0cf62;
      --white: #ffffff;
      --text: #172033;
      --muted: #68758a;
      --line: #dfe5ee;
      --danger: #b42318;
      --success: #087443;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: var(--text);
    }

    a {
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      background: var(--navy);
      padding: 15px 20px;
    }

    .topbar-inner {
      width: min(1100px, 94%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-weight: 800;
    }

    .brand img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
    }

    .brand-name {
      font-size: 16px;
    }

    .brand-tagline {
      display: block;
      color: var(--gold-light);
      font-size: 8px;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .home-link {
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 700;
    }

    /* =========================
       LOGIN
    ========================= */

    .page {
      width: min(470px, 94%);
      margin: 60px auto;
    }

    .login-card {
      background: var(--white);
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(7, 26, 58, 0.10);
      border: 1px solid #e7ebf2;
    }

    .heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .heading h1 {
      color: var(--navy);
      margin: 0 0 8px;
      font-size: 31px;
    }

    .heading p {
      color: var(--muted);
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      background: var(--gold);
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: var(--gold-light);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fff1f0;
      color: var(--danger);
      border: 1px solid #f5c2c0;
    }

    .message.success {
      display: block;
      background: #edfdf5;
      color: var(--success);
      border: 1px solid #b7e5ce;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 8px;
      color: #9a7711;
      font-size: 13px;
      font-weight: 700;
    }

    .register-link {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .register-link a {
      color: #9a7711;
      font-weight: 800;
    }

    .back-home {
      text-align: center;
      margin-top: 18px;
    }

    .back-home a {
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 600px) {

      .login-card {
        padding: 25px 19px;
      }

      .heading h1 {
        font-size: 27px;
      }

      .home-link {
        font-size: 12px;
      }

      .brand-name {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <div class="topbar-inner">

      <a href="index.html" class="brand">

        <img
          src="logo.jpg"
          alt="RAYHAR ACADEMY Logo"
        >

        <span class="brand-name">

          RAYHAR ACADEMY

          <small class="brand-tagline">
            FOR KNOWLEDGE AND LEADERSHIP
          </small>

        </span>

      </a>


      <a
        href="index.html"
        class="home-link"
      >
        ← Home
      </a>

    </div>

  </header>


  <!-- LOGIN -->

  <main class="page">

    <div class="login-card">

      <div class="heading">

        <h1>
          Student Login
        </h1>

        <p>
          Welcome back to RAYHAR ACADEMY.
        </p>

      </div>


      <div
        id="message"
        class="message"
      ></div>


      <form id="loginForm">

        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <a
            href="#"
            id="forgotPassword"
            class="forgot"
          >
            Forgot password?
          </a>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          id="loginButton"
        >
          LOGIN
        </button>

      </form>


      <div class="register-link">

        Don't have a student account?

        <a href="student-register.html">
          Create an Account
        </a>

      </div>


      <div class="back-home">

        <a href="index.html">
          Back to RAYHAR ACADEMY
        </a>

      </div>

    </div>

  </main>


  <footer>
    © 2026 RAYHAR ACADEMY — For Knowledge and Leadership.
  </footer>


  <script>

    const supabaseClient = window.supabaseClient;

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const forgotPassword =
      document.getElementById("forgotPassword");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password.",
            "error"
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "LOGGING IN...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          if (error) {
            throw error;
          }


          showMessage(
            "Login successful. Opening your student portal...",
            "success"
          );


          setTimeout(function() {

            window.location.href =
              "student-portal.html";

          }, 800);


        } catch (error) {

          console.error(error);


          showMessage(
            "Invalid email or password. Please check your details and try again.",
            "error"
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "LOGIN";

        }

      }
    );


    /* =========================
       FORGOT PASSWORD
    ========================= */

    forgotPassword.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

          showMessage(
            "Enter your email address first, then click Forgot password.",
            "error"
          );

          return;
        }


        try {

          const {
            error
          } =
            await supabaseClient.auth.resetPasswordForEmail(
              email,
              {
                redirectTo:
                  window.location.origin +
                  "/student-auth.html"
              }
            );


          if (error) {
            throw error;
          }


          showMessage(
            "If this email is registered, a password reset link has been sent to it.",
            "success"
          );


        } catch (error) {

          console.error(error);


          showMessage(
            error.message ||
            "Unable to send the password reset email.",
            "error"
          );

        }

      }
    );


    /* =========================
       CHECK EXISTING SESSION
    ========================= */

    async function checkExistingSession() {

      try {

        const {
          data
        } =
          await supabaseClient.auth.getSession();


        if (
          data &&
          data.session
        ) {

          window.location.href =
            "student-portal.html";

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    checkExistingSession();

  </script>

</body>
        </html>
