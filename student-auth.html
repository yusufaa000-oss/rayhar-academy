<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | RAYHAR ACADEMY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #0d1a2b;
      border: 1px solid #2a3a50;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 5px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #081321;
      border: 1px solid #35475d;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #07111f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #e3c45e;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #391619;
      border: 1px solid #a94442;
      color: #ffc5c5;
    }

    .success {
      display: block;
      background: #12351f;
      border: 1px solid #2e8b57;
      color: #b8f5ca;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #aaa;
    }

    .register a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #d4af37;
    }
  </style>
</head>

<body>

<div class="card">

  <img
    src="logo.jpg"
    class="logo"
    alt="RAYHAR ACADEMY"
  >

  <h1>RAYHAR ACADEMY</h1>

  <p class="subtitle">
    Student Login
  </p>

  <form id="loginForm">

    <div class="field">
      <label for="email">
        Email Address
      </label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >
    </div>

    <div class="field">
      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >
    </div>

    <button
      id="loginButton"
      type="submit"
    >
      Login
    </button>

  </form>

  <div id="message" class="message"></div>

  <div class="register">
    Don't have an account?
    <a href="student-register.html">
      Register here
    </a>
  </div>

  <a
    href="index.html"
    class="back"
  >
    ← Back to RAYHAR ACADEMY
  </a>

</div>

<script src="config.js"></script>

<script>

const client = window.supabaseClient;

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}

async function redirectUser(user) {

  /*
    First check the student's profile.
  */

  const {
    data: profile,
    error: profileError
  } = await client
    .from("profiles")
    .select("id, role, student_id")
    .eq("id", user.id)
    .single();

  if (profileError || !profile) {

    throw new Error(
      "Your student profile could not be found."
    );
  }

  /*
    ADMINISTRATOR
  */

  if (profile.role === "admin") {

    window.location.href =
      "admin-portal.html";

    return;
  }

  /*
    STUDENT
    Check whether biodata has already
    been completed.
  */

  const {
    data: biodata,
    error: biodataError
  } = await client
    .from("student_biodata")
    .select("id")
    .eq("student_id", user.id)
    .maybeSingle();

  if (biodataError) {

    console.error(biodataError);

    throw new Error(
      "We could not check your application information."
    );
  }

  /*
    NO BIODATA
    Send student to biodata page.
  */

  if (!biodata) {

    window.location.href =
      "student-biodata.html";

    return;
  }

  /*
    BIODATA EXISTS
    Send student to portal.
  */

  window.location.href =
    "student-portal.html";
}

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    message.style.display = "none";

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    try {

      const {
        data,
        error
      } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      if (!data.user) {

        throw new Error(
          "Login was unsuccessful."
        );
      }

      showMessage(
        "Login successful. Opening your account...",
        "success"
      );

      await redirectUser(data.user);

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Unable to log in. Please check your email and password.",
        "error"
      );

      loginButton.disabled = false;
      loginButton.textContent = "Login";
    }

  }
);

</script>

</body>
  </html>
