<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Student Account | RAYHAR ACADEMY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #0d1828;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
      border-radius: 50%;
    }

    h1 {
      text-align: center;
      color: #d4af37;
      font-size: 27px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8c6;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .section-title {
      color: #d4af37;
      font-size: 16px;
      font-weight: bold;
      margin: 22px 0 13px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }

    label {
      display: block;
      color: #e7ebf0;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 16px;
      background: #091321;
      color: white;
      border: 1px solid #2c3b50;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
    }

    select option {
      background: #091321;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      background: #d4af37;
      color: #07111f;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e4c45b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(40,167,69,0.15);
      border: 1px solid rgba(40,167,69,0.4);
      color: #75e08a;
    }

    .error {
      display: block;
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.4);
      color: #ff8d98;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #aeb8c6;
      font-size: 14px;
    }

    .login-link a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #667487;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <img src="logo.jpg" alt="RAYHAR ACADEMY Logo" class="logo">

    <h1>RAYHAR ACADEMY</h1>

    <p class="subtitle">
      Create Your Student Account
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <div class="section-title">
        Personal Information
      </div>

      <label for="fullName">Full Name</label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <div class="section-title">
        Academic Information
      </div>

      <label for="department">Department</label>

      <select id="department" required>
        <option value="">Select Department</option>

        <option value="Arabic Department">
          Arabic Department
        </option>

        <option value="Computer Science Department">
          Computer Science Department
        </option>

        <option value="English Department">
          English Department
        </option>

        <option value="Fine Art Department">
          Fine Art Department
        </option>

        <option value="Mathematics Department">
          Mathematics Department
        </option>

        <option value="Medical Science Department">
          Medical Science Department
        </option>

        <option value="Quran & Islamic Studies Department">
          Quran & Islamic Studies Department
        </option>

        <option value="Science Department">
          Science Department
        </option>
      </select>

      <label for="studyLevel">Study Level</label>

      <select id="studyLevel" required>
        <option value="">Select Study Level</option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>
      </select>

      <div class="section-title">
        Account Information
      </div>

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter your password again"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        Create Student Account
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="student-auth.html">Login here</a>
    </div>

  </div>

  <div class="footer">
    RAYHAR ACADEMY — For Knowledge and Leadership.
  </div>

</div>


<script>

const client = window.supabaseClient;

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const registerButton = document.getElementById("registerButton");


function showMessage(text, type) {

  message.textContent = text;

  message.className = "message " + type;

}


/*
  Generate the next RAYHAR Student ID.
  Example:
  RAYHAR-000001
  RAYHAR-000002
  RAYHAR-000003
*/

async function generateStudentId() {

  const { data, error } = await client
    .from("profiles")
    .select("student_id")
    .like("student_id", "RAYHAR-%");

  if (error) {
    throw error;
  }

  let highestNumber = 0;

  if (data && data.length > 0) {

    data.forEach(function(profile) {

      if (!profile.student_id) {
        return;
      }

      const match =
        profile.student_id.match(/^RAYHAR-(\d+)$/);

      if (match) {

        const number =
          parseInt(match[1], 10);

        if (number > highestNumber) {
          highestNumber = number;
        }

      }

    });

  }

  const nextNumber =
    highestNumber + 1;

  return "RAYHAR-" +
    String(nextNumber).padStart(6, "0");

}


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  message.className = "message";
  message.textContent = "";

  const fullName =
    document.getElementById("fullName").value.trim();

  const department =
    document.getElementById("department").value;

  const studyLevel =
    document.getElementById("studyLevel").value;

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  if (password !== confirmPassword) {

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  if (password.length < 6) {

    showMessage(
      "Password must contain at least 6 characters.",
      "error"
    );

    return;
  }


  registerButton.disabled = true;

  registerButton.textContent =
    "Creating Account...";


  try {

    /*
      Step 1:
      Generate Student ID automatically.
    */

    const studentId =
      await generateStudentId();


    /*
      Step 2:
      Create authentication account.
    */

    const {
      data: authData,
      error: authError
    } = await client.auth.signUp({

      email: email,

      password: password

    });


    if (authError) {
      throw authError;
    }


    if (!authData.user) {

      throw new Error(
        "The account could not be created."
      );

    }


    /*
      Step 3:
      Create the student's profile.
    */

    const {
      error: profileError
    } = await client
      .from("profiles")
      .insert({

        id: authData.user.id,

        full_name: fullName,

        email: email,

        student_id: studentId,

        department: department,

        study_level: studyLevel,

        status: "active"

      });


    if (profileError) {

      console.error(
        "Profile error:",
        profileError
      );

      throw new Error(
        "The account was created, but the student profile could not be saved."
      );

    }


    /*
      Step 4:
      Find the selected department.
    */

    const {
      data: departmentData,
      error: departmentError
    } = await client
      .from("departments")
      .select("id")
      .eq("name", department)
      .maybeSingle();


    if (departmentError) {

      console.error(
        "Department error:",
        departmentError
      );

    }


    /*
      Step 5:
      Create the student's enrollment.
    */

    if (departmentData) {

      const {
        error: enrollmentError
      } = await client
        .from("enrollments")
        .insert({

          student_id: authData.user.id,

          department_id: departmentData.id,

          study_level: studyLevel,

          status: "active"

        });


      if (enrollmentError) {

        console.error(
          "Enrollment error:",
          enrollmentError
        );

      }

    }


    /*
      Account successfully created.
    */

    showMessage(
      "Account created successfully! Your Student ID is " +
      studentId +
      ". Redirecting you to login...",
      "success"
    );


    form.reset();


    setTimeout(function() {

      window.location.replace(
        "student-auth.html"
      );

    }, 3000);


  } catch (error) {

    console.error(
      "Registration error:",
      error
    );


    let errorMessage =
      error.message ||
      "Something went wrong while creating your account.";


    if (
      errorMessage
        .toLowerCase()
        .includes("already registered")
    ) {

      errorMessage =
        "This email address is already registered. Please use another email or log in.";

    }


    showMessage(
      errorMessage,
      "error"
    );


  } finally {

    registerButton.disabled = false;

    registerButton.textContent =
      "Create Student Account";

  }

});

</script>

</body>
</html>
