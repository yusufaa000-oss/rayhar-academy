<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Student Account | RAYHAR ACADEMY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: #0d1828;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
      border-radius: 50%;
    }

    h1 {
      text-align: center;
      color: #d4af37;
      font-size: 27px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8c6;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .section-title {
      color: #d4af37;
      font-size: 16px;
      font-weight: bold;
      margin: 22px 0 13px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    label {
      display: block;
      color: #e7ebf0;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 16px;
      background: #091321;
      color: white;
      border: 1px solid #2c3b50;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
    }

    select option {
      background: #091321;
      color: white;
    }

    .departments {
      background: #091321;
      border: 1px solid #2c3b50;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .department-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 5px;
      cursor: pointer;
      color: #e7ebf0;
    }

    .department-option input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #d4af37;
      cursor: pointer;
    }

    .department-option span {
      font-size: 14px;
    }

    .hint {
      color: #929eae;
      font-size: 12px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      background: #d4af37;
      color: #07111f;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e4c45b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(40, 167, 69, 0.15);
      border: 1px solid rgba(40, 167, 69, 0.4);
      color: #75e08a;
    }

    .error {
      display: block;
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid rgba(220, 53, 69, 0.4);
      color: #ff8d98;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #aeb8c6;
      font-size: 14px;
    }

    .login-link a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: #667487;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <img
      src="logo.jpg"
      alt="RAYHAR ACADEMY Logo"
      class="logo"
    >

    <h1>RAYHAR ACADEMY</h1>

    <p class="subtitle">
      Create Your Student Account
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <div class="section-title">
        Personal Information
      </div>

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >


      <div class="section-title">
        Academic Information
      </div>

      <label>
        Select Department(s)
      </label>

      <div class="departments">

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Arabic Department"
          >
          <span>Arabic Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Computer Science Department"
          >
          <span>Computer Science Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="English Department"
          >
          <span>English Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Fine Art Department"
          >
          <span>Fine Art Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Mathematics Department"
          >
          <span>Mathematics Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Medical Science Department"
          >
          <span>Medical Science Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Quran & Islamic Studies Department"
          >
          <span>Quran & Islamic Studies Department</span>
        </label>

        <label class="department-option">
          <input
            type="checkbox"
            name="departments"
            value="Science Department"
          >
          <span>Science Department</span>
        </label>

      </div>

      <p class="hint">
        You can select more than one department.
      </p>


      <label for="studyLevel">
        Study Level
      </label>

      <select id="studyLevel" required>

        <option value="">
          Select Study Level
        </option>

        <option value="Beginner">
          Beginner
        </option>

        <option value="Intermediate">
          Intermediate
        </option>

        <option value="Advanced">
          Advanced
        </option>

      </select>


      <div class="section-title">
        Account Information
      </div>

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >


      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter your password again"
        minlength="6"
        required
      >


      <button
        type="submit"
        id="registerButton"
      >
        Create Student Account
      </button>

    </form>


    <div class="login-link">

      Already have an account?

      <a href="student-auth.html">
        Login here
      </a>

    </div>

  </div>


  <div class="footer">
    RAYHAR ACADEMY — For Knowledge and Leadership.
  </div>

</div>


<script>

const client = window.supabaseClient;

const form =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");

const registerButton =
  document.getElementById("registerButton");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


async function generateStudentId() {

  const {
    data,
    error
  } = await client
    .from("profiles")
    .select("student_id")
    .like("student_id", "RAYHAR-%");

  if (error) {
    throw error;
  }

  let highestNumber = 0;

  (data || []).forEach(function(profile) {

    const match =
      (profile.student_id || "")
        .match(/^RAYHAR-(\d+)$/);

    if (match) {

      highestNumber =
        Math.max(
          highestNumber,
          parseInt(match[1], 10)
        );

    }

  });

  return "RAYHAR-" +
    String(highestNumber + 1)
      .padStart(6, "0");

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();


    const studyLevel =
      document
        .getElementById("studyLevel")
        .value;


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    const selectedDepartments =
      Array.from(
        document.querySelectorAll(
          'input[name="departments"]:checked'
        )
      ).map(function(checkbox) {

        return checkbox.value;

      });


    if (selectedDepartments.length === 0) {

      showMessage(
        "Please select at least one department.",
        "error"
      );

      return;

    }


    if (password !== confirmPassword) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;

    }


    registerButton.disabled = true;

    registerButton.textContent =
      "Creating Account...";


    try {

      const studentId =
        await generateStudentId();


      const {
        data: authData,
        error: authError
      } =
        await client.auth.signUp({

          email: email,

          password: password

        });


      if (authError) {
        throw authError;
      }


      if (!authData.user) {

        throw new Error(
          "The account could not be created."
        );

      }


      const {
        error: profileError
      } =
        await client
          .from("profiles")
          .insert({

            id: authData.user.id,

            full_name: fullName,

            email: email,

            student_id: studentId,

            department:
              selectedDepartments[0],

            study_level: studyLevel,

            status: "active"

          });


      if (profileError) {
        throw profileError;
      }


      const {
        data: departmentsData,
        error: departmentsError
      } =
        await client
          .from("departments")
          .select("id, name")
          .in(
            "name",
            selectedDepartments
          );


      if (departmentsError) {
        throw departmentsError;
      }


      const enrollments =
        (departmentsData || []).map(
          function(department) {

            return {

              student_id:
                authData.user.id,

              department_id:
                department.id,

              study_level:
                studyLevel,

              status:
                "active"

            };

          }
        );


      if (enrollments.length > 0) {

        const {
          error: enrollmentError
        } =
          await client
            .from("enrollments")
            .insert(enrollments);


        if (enrollmentError) {
          throw enrollmentError;
        }

      }


      showMessage(
        "Account created successfully! Your Student ID is " +
        studentId +
        ". Taking you to login...",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "student-auth.html";

      }, 1500);


    } catch (error) {

      console.error(
        "Registration error:",
        error
      );


      let errorMessage =
        error.message ||
        "Something went wrong while creating your account.";


      if (
        errorMessage
          .toLowerCase()
          .includes("already registered")
      ) {

        errorMessage =
          "This email address is already registered. Please use another email or log in.";

      }


      showMessage(
        errorMessage,
        "error"
      );


    } finally {

      registerButton.disabled = false;

      registerButton.textContent =
        "Create Student Account";

    }

  });

</script>

</body>
  </html>
